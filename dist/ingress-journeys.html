<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingress Layers</title>
<style>
/* FlowKit: 3D architecture animation kit (CSS 3D, deterministic timeline) */
.fk-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #060B17;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #E2E8F0; box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
.fk-frame.dragging { cursor: grabbing; }
.fk-scaler { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.fk-stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 50%; overflow: hidden;
  background: radial-gradient(ellipse at 50% 20%, #13264A 0%, #0A1530 50%, #050A16 100%); }
.fk-world { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
.fk-n { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.fk-f { position: absolute; box-sizing: border-box; backface-visibility: hidden; }
.fk-f.two { backface-visibility: visible; }
.fk-bb { position: absolute; left: 0; top: 0; }
.fk-ov, .fk-hud { position: absolute; inset: 0; pointer-events: none; }
.fk-hud-i { pointer-events: auto; cursor: default; }
.fk-dip { position: absolute; inset: 0; background: #050A16; opacity: 0; pointer-events: none; }

/* Devices */
.fk-dev { --led: #34D399; --accent: #38BDF8; }
.fk-dev .fk-f { box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .28); }
.fk-dev .fk-glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, var(--led), transparent); opacity: .35; }
.fk-ledstrip { position: absolute; width: 5px; background: repeating-linear-gradient(180deg, var(--led) 0 5px, transparent 5px 16px); filter: drop-shadow(0 0 3px var(--led)); }
.fk-slots { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: repeating-linear-gradient(180deg, transparent 0 14px, rgba(148, 163, 184, .14) 14px 16px); }
.fk-n.err .fk-f.f-front, .fk-n.err .fk-f.f-top { background-color: #7F1D1D !important; }
.fk-dev.down .fk-f.f-front, .fk-dev.down .fk-f.f-top { background-color: #3B1220 !important; }
.fk-dimmed .fk-f { filter: brightness(.32) saturate(.4); }

/* Signposts */
.fk-signb { position: absolute; inset: 0; clip-path: polygon(0 0, 86% 0, 100% 50%, 86% 100%, 0 100%); background: color-mix(in srgb, var(--sc) 22%, #0B1220); transition: background-color .2s; }
.fk-signb.on { background: var(--sc); }
.fk-sign { height: 100%; display: flex; align-items: center; padding-left: 12px; font: 700 21px/1 system-ui, sans-serif; color: #E2E8F0; letter-spacing: .02em; white-space: nowrap; }
.fk-signb.on .fk-sign { color: #0B1220; }

/* Links */
.fk-link .fk-f { background: #2E5E96; transition: background-color .2s, box-shadow .2s; }
.fk-link.steer .fk-f { background: rgba(148, 163, 184, .25); }
.fk-link.pvt .fk-f { background: rgba(45, 212, 191, .45); box-shadow: 0 0 8px rgba(45, 212, 191, .35); }
.fk-link.lit .fk-f { background: #38BDF8; box-shadow: 0 0 12px #38BDF8; }
.fk-link.mtls .fk-f { background: #A78BFA; box-shadow: 0 0 12px #A78BFA; }
.fk-link.ok .fk-f { background: #34D399; box-shadow: 0 0 12px #34D399; }
.fk-link.bad .fk-f { background: #F43F5E; box-shadow: 0 0 12px #F43F5E; }
.fk-link.dns .fk-f { background: #F472B6; box-shadow: 0 0 12px #F472B6; }
.fk-link.priv .fk-f { background: #2DD4BF; box-shadow: 0 0 12px #2DD4BF; }
.fk-link.dead .fk-f { background: #3A2430; box-shadow: none; }
/* DNS pipe: one quiet connection between the clients and the DNS control plane (muted slate, slow drift) */
.fk-link.dnspipe .fk-f { animation: fkPipe 6s linear infinite; }
.fk-link.dnspipe .fk-f:first-child { background: repeating-linear-gradient(180deg, rgba(148, 163, 184, .38) 0 6px, rgba(148, 163, 184, .14) 6px 14px); background-size: 100% 14px; }
.fk-link.dnspipe .fk-f:last-child { background: repeating-linear-gradient(90deg, rgba(148, 163, 184, .38) 0 6px, rgba(148, 163, 184, .14) 6px 14px); background-size: 14px 100%; animation-name: fkPipeX; }
.fk-link.dnspipe.dns .fk-f { box-shadow: 0 0 8px rgba(203, 213, 225, .35); filter: brightness(1.5); }
@keyframes fkPipe { to { background-position: 0 14px; } }
@keyframes fkPipeX { to { background-position: 14px 0; } }
/* DNS flow lines: small feeders (clients -> pipe -> NS / GTM / LB), drifting slowly out and back */
.fk-link.dnsflow .fk-f { --ps: 16px; box-shadow: none; animation: fkFlow 8s ease-in-out infinite alternate; }
.fk-link.dnsflow .fk-f:first-child { background: repeating-linear-gradient(180deg, rgba(148, 163, 184, .34) 0 30%, transparent 30% 100%); background-size: 100% var(--ps); }
.fk-link.dnsflow .fk-f:last-child { background: repeating-linear-gradient(90deg, rgba(148, 163, 184, .34) 0 30%, transparent 30% 100%); background-size: var(--ps) 100%; animation-name: fkFlowX; }
.fk-link.dnsflow.dns .fk-f { filter: brightness(1.8); box-shadow: 0 0 6px rgba(203, 213, 225, .3); }
@keyframes fkFlow { from { background-position: 0 0; } to { background-position: 0 calc(var(--ps) * 6); } }
@keyframes fkFlowX { from { background-position: 0 0; } to { background-position: calc(var(--ps) * 6) 0; } }

/* Control-plane lines (DNS steering decisions): dashed, never carry traffic */
.fk-link.steer .fk-f:first-child { background: repeating-linear-gradient(180deg, rgba(148, 163, 184, .32) 0 4px, transparent 4px 10px); box-shadow: none; }
.fk-link.steer .fk-f:last-child { background: repeating-linear-gradient(90deg, rgba(148, 163, 184, .32) 0 4px, transparent 4px 10px); box-shadow: none; }
.fk-link.steer.dns .fk-f:first-child { background: repeating-linear-gradient(180deg, #CBD5E1 0 4px, transparent 4px 10px); }
.fk-link.steer.dns .fk-f:last-child { background: repeating-linear-gradient(90deg, #CBD5E1 0 4px, transparent 4px 10px); }

/* Zones */
.fk-zlabel { font: 700 44px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.fk-zlabel small { display: block; font-size: 22px; letter-spacing: .06em; font-weight: 500; margin-top: 8px; opacity: .8; text-transform: none; }

/* Screen-space labels */
.fk-label { transform: translate(-50%, -100%); white-space: nowrap; background: rgba(8, 15, 32, .86); border: 1px solid rgba(125, 211, 252, .35);
  border-radius: 7px; padding: 4px 9px; font-size: 12px; color: #E2E8F0; display: flex; align-items: center; gap: 7px; transition: border-color .3s, box-shadow .3s, opacity .3s; }
.fk-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--led, #34D399); box-shadow: 0 0 6px var(--led, #34D399); flex: none; }
.fk-label .ly { font: 700 9px/1 ui-monospace, Menlo, monospace; color: #0B1220; background: var(--lc); border-radius: 3px; padding: 2px 3px; }
.fk-label .sub { display: none; color: #7DD3FC; font-size: 11px; }
.fk-label.dev { pointer-events: auto; cursor: pointer; }
.fk-label.dev:hover, .fk-label.sel { border-color: #7DD3FC; }
.fk-label.dev:hover .sub, .fk-label.active .sub, .fk-label.sel .sub { display: inline; }
.fk-label.active { border-color: #7DD3FC; box-shadow: 0 0 18px rgba(56, 189, 248, .45); }
.fk-label.sel { box-shadow: 0 0 0 2px #7DD3FC, 0 0 18px rgba(56, 189, 248, .45); }
.fk-label.dim { opacity: .3; }
.fk-label.wall { font-size: 11px; color: #CBD5E1; }
.no-labels .fk-label:not(.active):not(.sel) { display: none; }

/* Packet */
.fk-core { width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; }
.fk-chip { transform: translate(-50%, -100%); white-space: nowrap; background: rgba(8, 15, 32, .92); border-radius: 6px; padding: 4px 8px;
  font: 600 11px ui-monospace, Menlo, monospace; color: #E0F2FE; border: 1px solid var(--pc, #38BDF8); display: flex; align-items: center; gap: 6px; }
.fk-chip small { font: 500 10px system-ui, sans-serif; color: #94A3B8; }

.fk-dot { border-radius: 50%; background: var(--c); box-shadow: 0 0 10px 2px var(--c); }

/* Drill-down: deployment view that slides out of a node */
.fk-dwrap { position: absolute; left: 0; top: 0; }
.fk-dwrap .lead line { stroke: rgba(125, 211, 252, .55); stroke-width: 1.5; stroke-dasharray: 4 4; }
.fk-drill { position: relative; transform-origin: 0 100%; background: rgba(6, 12, 26, .97); border: 1px solid rgba(125, 211, 252, .5); border-radius: 12px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .6); font-size: 11px; color: #CBD5E1; }
.fk-drill .dh { position: absolute; left: 18px; top: 11px; right: 18px; display: flex; gap: 10px; align-items: baseline; }
.fk-drill .dh b { font-size: 14px; color: #F1F5F9; }
.fk-drill .dh span { color: #7DD3FC; font-size: 11px; }
.fk-drill .fr { position: absolute; left: 18px; top: 34px; right: 18px; font: 10px ui-monospace, Menlo, monospace; color: #64748B; border: 1px dashed rgba(100, 116, 139, .5); border-radius: 6px; padding: 3px 8px; }
.fk-drill .lnl { position: absolute; font: 600 10px ui-monospace, Menlo, monospace; color: #7DD3FC; letter-spacing: .04em; }
.fk-drill .box { position: absolute; border: 1px dashed rgba(52, 211, 153, .45); border-radius: 10px; background: rgba(16, 40, 32, .25); }
.fk-drill .box span { position: absolute; left: 9px; top: 7px; font: 600 10px ui-monospace, Menlo, monospace; color: #6EE7B7; letter-spacing: .03em; }
.fk-drill .st { position: absolute; box-sizing: border-box; border: 1px solid #1E293B; background: #0B1324; border-radius: 9px; padding: 7px 9px; transition: border-color .2s, box-shadow .2s, background-color .2s, opacity .2s; }
.fk-drill .st.active { border-color: #38BDF8; box-shadow: 0 0 16px rgba(56, 189, 248, .35); background: #0E2038; }
.fk-drill .st.done { border-color: rgba(52, 211, 153, .7); }
.fk-drill .st.fail { border-color: #F43F5E; box-shadow: 0 0 16px rgba(244, 63, 94, .35); background: #2A0E18; }
.fk-drill .st.skip { opacity: .42; border-style: dashed; }
.fk-drill .nm { font: 700 11.5px ui-monospace, Menlo, monospace; color: #E2E8F0; }
.fk-drill .sb { color: #7DD3FC; font-size: 9.5px; margin: 2px 0 4px; }
.fk-drill .ck { display: flex; gap: 6px; align-items: flex-start; line-height: 1.25; margin-top: 3px; opacity: .25; }
.fk-drill .ck.on { opacity: 1; }
.fk-drill .ck b { flex: none; width: 13px; height: 13px; border-radius: 50%; background: #1E293B; font-size: 8px; display: grid; place-items: center; margin-top: 1px; color: #0B1220; }
.fk-drill .ck.pass b { background: #34D399; } .fk-drill .ck.pass b::before { content: '\2713'; }
.fk-drill .ck.fail b { background: #F43F5E; color: #fff; } .fk-drill .ck.fail b::before { content: '\2715'; }
.fk-drill .ck.fail span { color: #FDA4AF; }
.fk-drill .ck.skip { opacity: .5; } .fk-drill .ck.skip b { background: #334155; color: #CBD5E1; } .fk-drill .ck.skip b::before { content: '\2013'; }
.fk-drill .note { margin-top: 5px; font-size: 9.5px; color: #94A3B8; font-style: italic; }
.fk-drill .st.fail .note { color: #FDA4AF; font-style: normal; font-weight: 600; }
.fk-drill .ar { position: absolute; height: 2px; background: #334155; }
.fk-drill .ar::after { content: ''; position: absolute; right: -1px; top: -3px; border: 4px solid transparent; border-left-color: #334155; border-right: 0; }
.fk-drill .tok { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #F8FAFC; box-shadow: 0 0 12px 3px #38BDF8; z-index: 3; }
.fk-drill .tok.bad { background: #FECDD3; box-shadow: 0 0 14px 4px #F43F5E; }
.fk-drill .tok.ok { box-shadow: 0 0 14px 4px #34D399; }
.fk-drill .tok.sig { background: #FBCFE8; box-shadow: 0 0 14px 4px #F472B6; }
.fk-drill .pl { position: absolute; box-sizing: border-box; border: 1px solid #1E293B; border-radius: 9px; background: #070D1A; padding: 7px 9px; overflow: hidden; }
.fk-drill .pl .ph { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 3px 6px; font: 700 10px ui-monospace, Menlo, monospace; color: #E2E8F0; }
.fk-drill .pl .bd { font: 600 9px system-ui; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
.fk-drill .pl pre { margin: 5px 0 0; font: 9.5px/1.4 ui-monospace, Menlo, monospace; color: #A5B4FC; white-space: pre-wrap; }
.fk-drill .pl pre .inj { background: rgba(244, 63, 94, .3); color: #FECDD3; border-radius: 2px; }
.fk-drill .pl pre .flag { background: rgba(251, 191, 36, .28); color: #FDE68A; border-radius: 2px; }
.fk-drill .pl .rs { margin-top: 4px; font: 600 9.5px ui-monospace, Menlo, monospace; }

/* Policy evaluation panel (inside a drill) */
.fk-drill .ev { display: flex; flex-direction: column; height: 100%; gap: 6px; }
.fk-drill .ev .eh { display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: baseline; font: 700 10.5px ui-monospace, Menlo, monospace; color: #E2E8F0; }
.fk-drill .ev .eh small { font: 600 9px system-ui; padding: 1px 6px; border-radius: 8px; }
.fk-drill .ev .js { font: 9.5px/1.45 ui-monospace, Menlo, monospace; color: #A5B4FC; background: #050A14; border: 1px solid #172033; border-radius: 6px; padding: 4px 7px; }
.fk-drill .ev .js div { border-radius: 3px; padding: 0 3px; white-space: pre; }
.fk-drill .ev .js .scan { background: rgba(56, 189, 248, .22); color: #E0F2FE; box-shadow: inset 2px 0 0 #38BDF8; }
.fk-drill .ev .js .hit { background: rgba(244, 63, 94, .28); color: #FECDD3; box-shadow: inset 2px 0 0 #F43F5E; }
.fk-drill .ev .js .inj { background: rgba(244, 63, 94, .35); color: #FFE4E6; border-radius: 2px; }
.fk-drill .ev .js .flag { background: rgba(251, 191, 36, .3); color: #FEF3C7; border-radius: 2px; }
.fk-drill .ev .pk { font: 600 9.5px ui-monospace, Menlo, monospace; color: #67E8F9; }
.fk-drill .ev .pk.route { color: #86EFAC; }
.fk-drill .ev .pk span { color: #64748B; font-weight: 400; }
.fk-drill .ev .rl { display: grid; grid-template-columns: 14px 128px 1fr; gap: 6px; align-items: center; font: 9.5px ui-monospace, Menlo, monospace; color: #CBD5E1; line-height: 1.35; }
.fk-drill .ev .rl i { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; font: 700 8px system-ui; font-style: normal; color: #0B1220; background: #34D399; }
.fk-drill .ev .rl.x i { background: #F43F5E; color: #fff; }
.fk-drill .ev .rl.cur { color: #F1F5F9; }
.fk-drill .ev .rl.cur i { background: #38BDF8; }
.fk-drill .ev .rl em { font-style: normal; color: #94A3B8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fk-drill .ev .rl.x em { color: #FDA4AF; }
.fk-drill .ev .out { margin-top: auto; font: 600 9.5px/1.4 ui-monospace, Menlo, monospace; border-top: 1px solid #1E293B; padding-top: 5px; }
.fk-drill .ev .out.ok { color: #34D399; } .fk-drill .ev .out.no { color: #FB7185; }

/* Panels (checklists, payload) */
.fk-panel { position: absolute; min-width: 240px; max-width: 330px; background: rgba(8, 15, 32, .94); border: 1px solid rgba(125, 211, 252, .4); border-radius: 10px;
  padding: 10px 12px; font-size: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
.fk-panel h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #7DD3FC; }
.fk-panel .it { display: flex; gap: 8px; align-items: center; padding: 3px 0; opacity: .25; transition: opacity .2s; }
.fk-panel .it.on { opacity: 1; }
.fk-panel .it b { width: 16px; height: 16px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10px; background: #1E293B; color: #0B1220; }
.fk-panel .it.on.pass b { background: #34D399; }
.fk-panel .it.on.fail b { background: #F43F5E; color: #fff; }
.fk-panel .it.on.warn b { background: #FBBF24; }
.fk-panel .it.on.skip b { background: #475569; color: #E2E8F0; }
.fk-panel .it.on.skip span { color: #94A3B8; }
.fk-panel .res { margin-top: 6px; padding-top: 6px; border-top: 1px solid #1E293B; font-weight: 600; opacity: 0; transition: opacity .2s; }
.fk-panel .res.on { opacity: 1; }
.fk-panel pre { margin: 0 0 6px; font: 11px/1.45 ui-monospace, Menlo, monospace; color: #CBD5E1; }
.fk-panel pre .hl { background: rgba(56, 189, 248, .18); }
.fk-panel pre .bad { background: rgba(244, 63, 94, .28); color: #FECDD3; }

/* HUD: caption, trace, legend, info card, free-camera pill */
.fk-caption { position: absolute; left: 50%; top: 0; width: 600px; margin-left: -300px; box-sizing: border-box; transform-origin: 50% 0; text-align: center;
  background: rgba(8, 15, 32, .72); border: 1px solid rgba(125, 211, 252, .28); padding: 11px 20px 13px; border-radius: 12px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .35); backdrop-filter: blur(3px); z-index: 5; }
@keyframes fkCap { from { opacity: 0; transform: translateY(6px); } }
.fk-caption .st { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #7DD3FC; }
.fk-caption .tx { font-size: 17px; line-height: 1.38; margin-top: 5px; color: #E2E8F0; }
.fk-trace { position: absolute; right: 18px; top: 16px; width: 360px; background: rgba(8, 15, 32, .86); border: 1px solid rgba(167, 139, 250, .35);
  border-radius: 10px; padding: 10px 12px; font-size: 11px; }
.no-trace .fk-trace, .fk-notrace .fk-trace { display: none; }
.fk-presenting .fk-trace, .fk-presenting .fk-legend { opacity: 0; transition: opacity .3s; }
.fk-trace, .fk-legend { transition: opacity .3s; }
.fk-trace h4 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #C4B5FD; display: flex; justify-content: space-between; }
.fk-trace .tid { font: 10px ui-monospace, Menlo, monospace; color: #94A3B8; margin: 3px 0 6px; }
.fk-trace .row { display: grid; grid-template-columns: 128px 1fr 44px; gap: 6px; align-items: center; height: 17px; }
.fk-trace .row.nw { animation: fkRow .3s ease-out; }
@keyframes fkRow { from { opacity: 0; transform: translateX(12px); } }
.fk-trace .svc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #CBD5E1; }
.fk-trace .lane { position: relative; height: 8px; background: rgba(148, 163, 184, .08); border-radius: 3px; }
.fk-trace .bar { position: absolute; top: 0; height: 8px; border-radius: 3px; background: #A78BFA; }
.fk-trace .bar.err { background: #F43F5E; }
.fk-trace .bar.warn { background: #FBBF24; }
.fk-trace .ms { text-align: right; color: #94A3B8; font: 10px ui-monospace, Menlo, monospace; }
.fk-trace .ms.err { color: #FDA4AF; }

.fk-legend { position: absolute; left: 16px; top: 16px; width: 250px; background: rgba(8, 15, 32, .86); border: 1px solid rgba(148, 163, 184, .25);
  border-radius: 10px; padding: 8px 6px 6px; font-size: 12px; }
.no-legend .fk-legend { display: none; }
.fk-legend h4 { margin: 0 6px 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #94A3B8; }
.fk-legend .lr { display: grid; grid-template-columns: 26px 1fr auto; gap: 7px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; position: relative; }
.fk-legend .lr:hover { background: rgba(148, 163, 184, .1); }
.fk-legend .lr b { font: 700 10px/1 ui-monospace, Menlo, monospace; color: #0B1220; background: var(--lc); border-radius: 4px; padding: 3px 0; text-align: center; }
.fk-legend .lr span { color: #E2E8F0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fk-legend .lr small { color: #64748B; font-size: 10px; white-space: nowrap; }
.fk-legend .lr.on { background: rgba(125, 211, 252, .1); }
.fk-legend .lr.cur { background: rgba(56, 189, 248, .18); box-shadow: inset 2px 0 0 #38BDF8; }
.fk-legend .lr.cur::after { content: ''; position: absolute; right: -4px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #38BDF8; box-shadow: 0 0 8px #38BDF8; }

.fk-info { position: absolute; right: 18px; bottom: 18px; width: 320px; background: rgba(8, 15, 32, .95); border: 1px solid rgba(125, 211, 252, .45);
  border-radius: 12px; padding: 12px 14px; font-size: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, .5); display: none; }
.fk-info.on { display: block; animation: fkCap .25s ease-out; }

  <div class="hint">Drag to orbit · right-drag to pan · wheel to zoom · click a device for details · press ? for all shortcuts</div>

<script>
/*
 * FlowKit: a small kit for 3D architecture animations (CSS 3D transforms, no dependencies).
 *
 * Coordinates: x right, y down (floor at y = 0, "up" is negative y), z towards the viewer.
 *
 * Time model: a Timeline is a set of tracks. Every track is a pure function of time, so the
 * scene can be scrubbed forwards and backwards, played in reverse or in slow motion and always
 * shows exactly the same frame for the same time. Nothing is fire-and-forget.
 *   tl.add(target, {prop: to | [from, to] | [k0, k1, k2...], duration, ease, delay}, pos)  continuous tween
 *   tl.set(target, key, pos, value, apply, init)                                             step value
 *   tl.mark(pos, step, text)                                                                 scrubber marker
 * Every timed helper takes (tl, pos, ...) and returns the time it finishes, so scripts chain:
 *   let t = 0; t = packet.travel(tl, t, route, 1200); t = stage.checklist(tl, t, {...});
 */
(function (global) {
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- easing ---------- */
  const EASES = {
    linear: k => k,
    inQuad: k => k * k,
    outQuad: k => 1 - (1 - k) * (1 - k),
    inOutQuad: k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2,
    inCubic: k => k * k * k,
    outCubic: k => 1 - Math.pow(1 - k, 3),
    inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
    inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,
    outSine: k => Math.sin(k * Math.PI / 2)

  const easeCache = {};
  function ease(name = 'outQuad') {
    if (typeof name === 'function') return name;
    if (EASES[name]) return EASES[name];
    if (easeCache[name]) return easeCache[name];
    const m = /^(in|out|inOut)Back(?:\(([\d.]+)\))?$/.exec(name);
    if (m) {
      const c1 = m[2] ? +m[2] : 1.70158, c3 = c1 + 1, c2 = c1 * 1.525;
      const f = m[1] === 'in' ? k => c3 * k * k * k - c1 * k * k
        : m[1] === 'out' ? k => 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2)
          : k => k < .5 ? (Math.pow(2 * k, 2) * ((c2 + 1) * 2 * k - c2)) / 2 : (Math.pow(2 * k - 2, 2) * ((c2 + 1) * (k * 2 - 2) + c2) + 2) / 2;
      return (easeCache[name] = f);
    }
    return EASES.outQuad;

  // Time fraction at which an ease first reaches y (for monotonic eases)
  function invEase(f, y) {
    if (y <= 0) return 0; if (y >= 1) return 1;
    let lo = 0, hi = 1;

    return hi;
  }

  /* ---------- DOM + geometry primitives ---------- */
  function el(tag, cls, parent, html) {
    const e = document.createElement(tag || 'div');
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  function g(parent, x = 0, y = 0, z = 0, extra = '') {
    const n = el('div', 'fk-n', parent);
    n.style.transform = `translate3d(${x}px,${y}px,${z}px) ${extra}`;
    return n;
  }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt)))));
    return `rgb(${c.join(',')})`;
  }
  const rgbaOf = hex => { const n = parseInt(hex.slice(1), 16); return a => `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  // Box centred at (x,y,z); "front" faces +z.
  function box(parent, { x = 0, y = 0, z = 0, w, h, d, c = '#1E293B', faces = 'front,back,left,right,top', cls = '', bg = {} }) {
    const b = el('div', 'fk-n ' + cls, parent);
    b.style.transform = `translate3d(${x}px,${y}px,${z}px)`;
    const defs = {
      front: [w, h, `translateZ(${d / 2}px)`, c],
      back: [w, h, `rotateY(180deg) translateZ(${d / 2}px)`, shade(c, -0.25)],
      right: [d, h, `rotateY(90deg) translateZ(${w / 2}px)`, shade(c, -0.18)],
      left: [d, h, `rotateY(-90deg) translateZ(${w / 2}px)`, shade(c, -0.08)],
      top: [w, d, `rotateX(90deg) translateZ(${h / 2}px)`, shade(c, 0.12)],
      bottom: [w, d, `rotateX(-90deg) translateZ(${h / 2}px)`, shade(c, -0.4)]
    };
    const out = { el: b };
    for (const k of faces.split(',')) {
      const [fw, fh, t, col] = defs[k];
      const f = el('div', 'fk-f f-' + k, b);
      f.style.cssText += `width:${fw}px;height:${fh}px;left:${-fw / 2}px;top:${-fh / 2}px;transform:${t};background:${bg[k] || col};`;
      out[k] = f;
    }
    return out;
  }
  function plane(parent, { w, h, t = '', bg = 'transparent', cls = '', two = false, html }) {
    const f = el('div', 'fk-f ' + cls + (two ? ' two' : ''), parent, html);
    f.style.cssText += `width:${w}px;height:${h}px;left:${-w / 2}px;top:${-h / 2}px;transform:${t};background:${bg};`;
    return f;
  }
  // Transform that stretches a z-aligned element of length L0 between points a and b
  function orient(a, b, L0 = 100) {
    const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];

      this.infoEl.innerHTML = `<div class="hd"><b style="--lc:${L.color || '#94A3B8'}">${L.tag || 'L' + (d.layer ?? '?')}</b><span>${L.name || ''}${L.alias ? ' · ' + L.alias : ''}</span><button data-a="close" title="Close (Esc)">&#10005;</button></div>
        <h3>${d.name}</h3><div class="tech">${d.sub}</div>

  // Caption: a card near the top of the stage; each new step crossfades in and stays until the next one.
  // While a deployment view is open (stage.present) it moves up into a compact banner so it never covers the view.
  class Caption {
    constructor(stage) {
      this.stage = stage;
      this.el = el('div', 'fk-caption', stage.hud, '<div class="st"></div><div class="tx"></div>');
      this.st = this.el.querySelector('.st'); this.tx = this.el.querySelector('.tx');
      this.readBase = 1500; this.readPerChar = 45;   // reading time: ms to notice + ms per character
      this.CY = 150; this.TY = 12; this.DS = .8;    // normal y, y and scale while a deployment view is open
      this.show(null); stage.onReset(() => this.show(null));
    }
    // Captions can be overridden from a config (window.FK_CAPTIONS[chapter title][original step]): { step, text, hold }
    at(tl, pos, step, text, { pop } = {}) {
      const ov = ((global.FK_CAPTIONS || {})[this.chapter] || {})[step] || {};
      const shown = ov.step ?? step, body = ov.text ?? text;
      tl.mark(pos, shown, body); tl.set(this, 'cap', pos, { step: shown, text: body }, v => this.show(v), null);
      if (!tl._caps) { tl._caps = []; tl.onFreeze(t2 => { this._readingTime(t2); this._layout(t2); }); }
      tl._caps.push({ pos, len: body.length, pop, hold: ov.hold });
      return pos;
    }
    // Give every caption time to be read (about 22 characters a second plus a moment to notice it): if the next
    // caption would replace it sooner, hold the whole timeline just before the next one
    // A caption's hold (seconds, from the config) replaces the reading-time rule for that caption
    _readingTime(tl) {
      const caps = tl._caps.slice().sort((a, b) => a.pos - b.pos);
      for (let i = 0; i < caps.length; i++) {
        const c = caps[i], need = c.hold != null ? c.hold * 1000 : Math.min(9000, this.readBase + c.len * this.readPerChar);
        if (i < caps.length - 1) { const window = caps[i + 1].pos - c.pos; if (window < need) tl.dilate(caps[i + 1].pos, need - window); }
        else tl.extend(c.pos + need);
      }
    }
    // Once the chapter is built: each caption fades in at its position and stays until the next one crossfades in.
    // The card only moves to make room for a deployment view (stage.present), and moves back afterwards.
    _layout(tl) {
      const { TY, DS } = this, CY = tl.capY ?? this.CY, e = this.el, pres = (tl._pres || []).slice().sort((a, b) => a.pos - b.pos);   // tl.capY: a chapter's own caption height
      const onAt = t => pres.reduce((v, p) => p.pos <= t ? p.v : v, false);
      const caps = tl._caps.slice().sort((a, b) => a.pos - b.pos);
      caps.forEach((c, i) => {
        const docked = c.pop === false || onAt(c.pos), y = docked ? TY : CY, sc = docked ? DS : 1;
        if (i > 0 && c.pos - caps[i - 1].pos > 400) tl.add(e, { opacity: [1, 0], duration: 180, ease: 'linear' }, c.pos - 180);
        tl.add(e, { y: [y, y], scale: [sc, sc], opacity: [0, 1], duration: 320, ease: 'outQuad' }, c.pos);
      });
      let on = false;
      for (const p of pres) {
        if (p.v === on) continue; on = p.v;
        tl.add(e, on ? { y: [CY, TY], scale: [1, DS], duration: 450, ease: 'inOutCubic' } : { y: [TY, CY], scale: [DS, 1], duration: 450, ease: 'inOutCubic' }, p.pos);
      }
    }
    hide(tl, pos) { tl.set(this, 'cap', pos, null, v => this.show(v), null); return pos; }
    show(v) {
      this.el.style.display = v ? '' : 'none'; if (!v) { this.st.textContent = ''; this.tx.textContent = ''; return; }
      this.st.textContent = v.step; this.tx.textContent = v.text;
    }
  }

  /* ---------- Trace panel (observability) ---------- */

  /* ---------- Latency budget (HUD): legs fill as a request spends time in each layer ---------- */

      this.stage = stage; this.target = target; this.legs = legs;

    }

      this.el.style.display = v === null ? 'none' : ''; if (v === null) return;
      const used = this.legs.map(() => null);
      plan.filter(p => p.pos <= v).forEach(p => { used[p.i] = (used[p.i] || 0) + p.ms; });
      const total = used.reduce((a, b) => a + (b || 0), 0);

    }
  }

  /* ---------- Observability wall ---------- */

  /* ---------- Devices ---------- */
  const HEALTH = { ok: '#34D399', warn: '#FBBF24', down: '#F43F5E' };
  class Device {
    constructor(stage, parent, o) {
      this.stage = stage; this.o = o;
      const { x = 0, z = 0, kind = 'rack', w = 120, h = 200, d = 110, color = '#1E293B', label = '', sub = '', led = '#34D399', accent = '#38BDF8' } = o;
      this.x = x; this.z = z; this.h = h; this.layer = o.layer; this.info = o.info; this.name = label; this.sub = sub;
      this.id = stage.devices.push(this) - 1;

      this.labelEl.style.setProperty('--led', led);

      this.screen0 = this.screen ? this.screen.innerHTML : null;

    }
    get top() { return [this.x, this.topY, this.z]; }
    port(dx = 0, dy = -50, dz = 0) { return [this.x + dx, dy, this.z + dz]; }
    focusShot() { return { x: this.x, y: this.topY * .6, z: this.z, rx: -22, ry: -18, d: 1700 }; }
    reset() {

    _show(v) { this.g.style.display = v ? '' : 'none'; this.labelBB.el.style.display = v && !this.o.nolabel ? '' : 'none'; }

    setLed(c) { this.g.style.setProperty('--led', c); this.labelEl.style.setProperty('--led', c); }

  }
  const ring3 = (parent, d, t, color, bw = 2) => { const p = plane(parent, { w: d, h: d, t, two: true }); p.style.border = `${bw}px solid ${color}`; p.style.borderRadius = '50%'; return p; };
  Device.kinds = {
    rack(p, { w, h, d, color }) {

      b.front.innerHTML = `<div class="fk-slots"></div><div class="fk-ledstrip" style="left:10px;top:10px;bottom:10px"></div><div class="fk-ledstrip" style="right:10px;top:18px;bottom:10px"></div>`;

      if (this.o.icon) { const ic = plane(p, { w: 70, h: 70, t: `translate3d(0,${-h - 60}px,0)`, two: true, html: this.o.icon }); ic.style.filter = 'drop-shadow(0 0 8px var(--accent))'; return h + 100; }
      return h;

    gateway(p, { w, h, d, color, o }) {

      for (let i = 0; i < 3; i++) {
        const b = box(p, { y: -u * (i + .5) - i * 4, w, h: u, d, c: color });
        b.front.innerHTML = `<div class="fk-ledstrip" style="left:12px;top:8px;height:${u - 16}px"></div><div style="position:absolute;right:14px;top:${u / 2 - 3}px;width:${w * .45}px;height:6px;border-radius:3px;background:var(--accent);opacity:.7"></div>`;

      return h + (o.icon ? 100 : 12);
    },
    // A cluster of edge servers (CDN PoP)
    edge(p, { color, o }) {
      [120, 160, 120].forEach((hh, i) => {
        const b = box(p, { x: (i - 1) * 76, y: -hh / 2, w: 66, h: hh, d: 70, c: color });
        b.front.innerHTML = `<div class="fk-slots"></div><div class="fk-ledstrip" style="left:8px;top:8px;bottom:8px"></div>`;
        b.top.style.boxShadow = 'inset 0 0 0 2px var(--accent)';
      });
      if (o.icon) { const ic = plane(p, { w: 70, h: 70, t: `translate3d(0,-220px,0)`, two: true, html: o.icon }); ic.style.filter = 'drop-shadow(0 0 8px var(--accent))'; return 260; }

    // Signpost (DNS-based steering): tells clients where to go, carries nothing. Arrow signs point downstream.
    signpost(p, { accent, o }) {

      box(p, { y: -150, w: 12, h: 280, d: 12, c: '#64748B' });
      const signs = o.signs || ['A', 'B'];
      this.signs = signs.map((txt, i) => {
        const pl = plane(p, { w: 240, h: 50, t: `translate3d(120px,${-262 + i * 66}px,0) rotateY(${i ? 10 : -10}deg)`, two: true,
          html: `<div class="fk-signb" style="--sc:${accent}"><div class="fk-sign">${txt}</div></div>` });

    },
    // Floating wireframe globe (DNS / global steering)
    globe(p, { w, accent, o }) {

      const wrap = g(p, 0, -fy - r, 0), spin = el('div', 'fk-n', wrap);
      for (let i = 0; i < 4; i++) ring3(spin, 2 * r, `rotateY(${i * 45}deg)`, accent);

      this.stage.billboard(wrap, `<div style="width:${2 * r}px;height:${2 * r}px;margin:${-r}px 0 0 ${-r}px;border-radius:50%;background:radial-gradient(circle at 38% 35%, ${accent}66, ${accent}18 55%, transparent 72%)"></div>`, { p: [0, 0, 0] });

      return fy + 2 * r;
    },
    laptop(p, { color, o }) {
      box(p, { y: -60, w: 240, h: 120, d: 170, c: '#1E293B' });
      box(p, { y: -124, z: 10, w: 170, h: 8, d: 110, c: color });
      const hinge = g(p, 0, -128, -45, 'rotateX(-12deg)');
      const lid = box(hinge, { y: -55, w: 170, h: 110, d: 6, c: color, faces: 'front,back,left,right,top' });
      lid.front.innerHTML = `<div class="scr" style="position:absolute;inset:6px;background:#F8FAFC;border-radius:3px;overflow:hidden;color:#0F172A;font:9px system-ui">${o.screen || ''}</div>`;
      this.screen = lid.front.querySelector('.scr');

    },
    // Monitor on a stand (API client / terminal)
    terminal(p, { color, o }) {
      box(p, { y: -30, w: 150, h: 60, d: 110, c: '#1E293B' });
      box(p, { y: -72, w: 16, h: 24, d: 16, c: '#334155' });
      const b = box(p, { y: -140, w: 180, h: 112, d: 8, c: color });
      b.front.innerHTML = `<div class="scr" style="position:absolute;inset:6px;background:#0B1220;border-radius:3px;overflow:hidden;color:#A7F3D0;font:8px/1.35 ui-monospace,Menlo,monospace;padding:5px 6px">${o.screen || ''}</div>`;
      this.screen = b.front.querySelector('.scr');
      return 200;
    },
    // AI agent: a cube with an orbiting core
    agent(p, { color, accent }) {
      const b = box(p, { y: -50, w: 100, h: 100, d: 100, c: color });
      b.front.innerHTML = `<div style="position:absolute;inset:0;display:grid;place-items:center;font:800 30px system-ui;color:${accent};text-shadow:0 0 10px ${accent}">AI</div>`;

      this.stage.billboard(wrap, `<div style="width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,${accent} 60%);box-shadow:0 0 22px 6px ${accent}"></div>`, { p: [0, 0, 0] });
      this.stage.spinners.push({ el: spin, speed: .06 });
      return 165;   // label just above the core, not above the orbit's empty space
    },
    // Private connectivity endpoint: a glowing ring traffic passes through
    portal(p, { accent, o }) {
      const fx = o.facing === 'x', R = o.r || 170, bw = R + 40;   // r: ring diameter; the plinth scales with it
      box(p, { y: -8, w: fx ? 60 : bw, h: 16, d: fx ? bw : 60, c: '#0F172A' });
      const ring = plane(p, { w: R, h: R, t: `translate3d(0,${-16 - R / 2}px,0)${fx ? ' rotateY(90deg)' : ''}`, two: true });

    },
    pods(p, { color, o }) {
      const n = o.count || 3, gap = o.gap || 110;
      this.pods = [];
      for (let i = 0; i < n; i++) {
        const pg = g(p, 0, 0, (i - (n - 1) / 2) * gap), inner = el('div', 'fk-n', pg);
        const b = box(inner, { y: -45, w: 70, h: 90, d: 70, c: color });
        b.top.innerHTML = `<div style="position:absolute;inset:12px;border-radius:50%;border:3px solid var(--accent)"></div>`;
        b.front.innerHTML = `<div class="fk-ledstrip" style="left:32px;top:10px;height:70px"></div>`;
        this.pods.push({ g: inner, z: this.z + (i - (n - 1) / 2) * gap, front: b.front, top: b.top, i });
      }
      box(p, { y: -4, w: 110, h: 8, d: gap * (n - 1) + 110, c: '#0F172A' });
      return 120;
    },
    phone(p, { color }) {
      box(p, { y: -50, w: 120, h: 100, d: 120, c: '#1E293B' });
      const s = g(p, 0, -100, 10, 'rotateX(-10deg)');
      const b = box(s, { y: -80, w: 84, h: 160, d: 8, c: color });
      b.front.style.borderRadius = '12px';
      b.front.innerHTML = `<div class="scr" style="position:absolute;inset:5px;background:#0F172A;border-radius:9px;overflow:hidden;color:#E2E8F0;font:9px system-ui;text-align:center">${this.o.screen || ''}</div>`;
      this.screen = b.front.querySelector('.scr');

    }
  };

  /* ---------- Zones, walls ---------- */
  function zone(stage, parent, { x1, x2, z1, z2, color = '#38BDF8', label = '', sub = '', alpha = .07 }) {
    const w = x2 - x1, d = z2 - z1, cx = (x1 + x2) / 2, cz = (z1 + z2) / 2, rgba = rgbaOf(color);
    const b = box(parent, { x: cx, y: -3, z: cz, w, h: 6, d, c: color, faces: 'top,front,right,left',
      bg: { top: rgba(alpha), front: rgba(.5), right: rgba(.35), left: rgba(.35) } });
    b.top.style.border = `2px solid ${rgba(.5)}`; b.top.style.borderRadius = '6px';
    if (label) {
      const lw = Math.min(900, w - 40);
      const t = plane(parent, { w: lw, h: 110, t: `translate3d(${x1 + lw / 2 + 24}px,-7px,${z2 - 70}px) rotateX(90deg)`, html: `<div class="fk-zlabel" style="color:${rgba(.85)}">${label}${sub ? `<small>${sub}</small>` : ''}</div>` });
      t.style.pointerEvents = 'none';
    }
    return b;
  }
  // Dashed boundary drawn on the floor through [x, z] points (e.g. a cloud provider's network)
  function outline(stage, parent, { pts, color = '#FF9900', label = '', sub = '', at, width = 8, dash = '34 20', fill = .025 }) {
    const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]), rgba = rgbaOf(color);
    const x1 = Math.min(...xs) - 20, x2 = Math.max(...xs) + 20, z1 = Math.min(...zs) - 20, z2 = Math.max(...zs) + 20, w = x2 - x1, h = z2 - z1;
    const svg = `<svg width="${w}" height="${h}" viewBox="${x1} ${z1} ${w} ${h}" style="display:block"><polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${rgba(fill)}" stroke="${rgba(.85)}" stroke-width="${width}" stroke-dasharray="${dash}" stroke-linejoin="round"/></svg>`;
    plane(parent, { w, h, t: `translate3d(${(x1 + x2) / 2}px,-9px,${(z1 + z2) / 2}px) rotateX(90deg)`, html: svg }).style.pointerEvents = 'none';
    if (label && at) plane(parent, { w: 900, h: 110, t: `translate3d(${at[0]}px,-10px,${at[1]}px) rotateX(90deg)`, html: `<div class="fk-zlabel" style="color:${rgba(.9)};text-align:right">${label}${sub ? `<small>${sub}</small>` : ''}</div>` }).style.pointerEvents = 'none';
  }
  class Wall {
    constructor(stage, parent, { x, z1, z2, h = 210, lanes = [], gap = 170, color = '#FBBF24', label = '' }) {
      this.x = x; this.z1 = z1; this.z2 = z2; this.gates = {}; this.color = color; this.parts = [];   // parts: its faces, for fading
      const rgba = this.rgba = rgbaOf(color);
      const bg = `repeating-linear-gradient(90deg, ${rgba(.26)} 0 2px, transparent 2px 26px), repeating-linear-gradient(0deg, ${rgba(.26)} 0 2px, transparent 2px 26px), ${rgba(.06)}`;
      const edges = [z1, ...lanes.flatMap(l => [l - gap / 2, l + gap / 2]), z2];
      for (let i = 0; i < edges.length; i += 2) {
        const a = edges[i], b = edges[i + 1]; if (b - a < 2) continue;
        const pl = plane(parent, { w: b - a, h, t: `translate3d(${x}px,${-h / 2}px,${(a + b) / 2}px) rotateY(90deg)`, bg, two: true });
        pl.style.borderTop = `3px solid ${rgba(.8)}`; this.parts.push(pl);
      }
      for (const l of lanes) {
        const hinge = g(parent, x, 0, l - gap / 2), door = el('div', 'fk-n', hinge);
        const pl = plane(door, { w: gap, h: h * .8, t: `translate3d(0,${-h * .4}px,${gap / 2}px) rotateY(90deg)`, bg: rgba(.22), two: true });
        pl.style.border = `2px solid ${rgba(.9)}`; this.parts.push(pl);
        this.gates[l] = { door, pl };
      }
      if (label) this.labelBB = stage.billboard(null, `<div class="fk-label wall" style="border-color:${rgba(.6)};--led:${color}"><i></i>${label}</div>`, { screen: true, p: [x, -h - 20, z1 + 60] });
      stage.onReset(() => Object.values(this.gates).forEach(q => this._paint(q, 'idle')));
    }
    _paint(q, s) { q.pl.style.background = s === 'pass' ? 'rgba(52,211,153,.35)' : s === 'deny' ? 'rgba(244,63,94,.5)' : this.rgba(.22); }
    _state(tl, pos, lane, s) { const q = this.gates[lane]; tl.set(q, 'st', pos, s, v => this._paint(q, v), 'idle'); }
    // Openings are collected and merged per gate when the timeline freezes, so packets that overlap at a gate
    // share one opening instead of snapping the door shut on each other.
    pass(tl, pos, lane, hold = 900) {
      if (!tl._doors) {
        tl._doors = new Map();   // gate -> { wall, iv: [[open, close]] }
        tl.freezers.unshift(t2 => t2._doors.forEach((d, q) => d.wall._emit(t2, q, d.iv)));   // before caption dilation
      }
      const q = this.gates[lane];
      if (!tl._doors.has(q)) tl._doors.set(q, { wall: this, iv: [] });
      tl._doors.get(q).iv.push([pos, pos + hold]);
      return pos + 600;
    }
    _emit(tl, q, iv) {
      iv.sort((a, b) => a[0] - b[0]);
      const merged = [];
      for (const [a, b] of iv) {
        const m = merged[merged.length - 1];
        if (m && a <= m[1] + 600 + 150) m[1] = Math.max(m[1], b); else merged.push([a, b]);
      }
      for (const [a, b] of merged) {
        tl.set(q, 'st', a, 'pass', v => this._paint(q, v), 'idle');
        tl.add(q.door, { rotateY: [0, -86], duration: 600, ease: 'inOutQuad' }, a);
        tl.add(q.door, { rotateY: [-86, 0], duration: 600, ease: 'inOutQuad' }, b);
        tl.set(q, 'st', b + 600, 'idle', v => this._paint(q, v), 'idle');
      }
    }
    deny(tl, pos, lane) {
      const q = this.gates[lane];
      this._state(tl, pos, lane, 'deny');
      tl.add(q.door, { x: [0, -6, 6, -4, 0], duration: 400, ease: 'linear' }, pos);
      this._state(tl, pos + 1400, lane, 'idle');
      return pos + 400;
    }
  }

  /* ---------- Links (cables) ---------- */
  const LINK_STATES = ['lit', 'mtls', 'ok', 'bad', 'dead', 'dns', 'priv'];
  class Link {
    constructor(stage, parent, pts, { t = 8, cls = '', layer, hidden = false } = {}) {
      this.pts = pts; this.segs = []; this.layer = layer; this.hidden = hidden;
      stage.links.push(this);
      for (let i = 0; i < pts.length - 1; i++) {
        const s = el('div', 'fk-n fk-link ' + cls, parent);
        s.style.transform = orient(pts[i], pts[i + 1]);
        plane(s, { w: t, h: 100, t: 'rotateX(90deg)', two: true, bg: '' });   // no inline background: link colours come from CSS
        plane(s, { w: 100, h: t, t: 'rotateY(90deg)', two: true, bg: '' });
        this.segs.push(s);
      }
      stage.onReset(() => { this.segs.forEach(s => setLinkState(s, '')); this._show(!hidden); });
      this._show(!hidden);
    }
    _show(v) { this.segs.forEach(s => { s.style.display = v ? '' : 'none'; }); }
    show(tl, pos, v) { tl.set(this, 'shown', pos, v, x => this._show(x), !this.hidden); return pos; }
    mark(tl, pos, cls) { this.segs.forEach(s => segState(tl, s, pos, cls)); return pos; }
    clear(tl, pos) { return this.mark(tl, pos, ''); }
  }
  function setLinkState(s, v) { s.classList.remove(...LINK_STATES); if (v) s.classList.add(v); }
  const segState = (tl, s, pos, v) => tl.set(s, 'st', pos, v, x => setLinkState(s, x), '');
  // Build a route through several links; reverse for responses.
  function route(links, reverse = false) {
    let pts = [], segs = [];
    const ls = reverse ? [...links].reverse() : links;
    for (const l of ls) {
      const p = reverse ? [...l.pts].reverse() : l.pts, s = reverse ? [...l.segs].reverse() : l.segs;
      if (pts.length && dist3(pts[pts.length - 1], p[0]) < 1) { pts.push(...p.slice(1)); } else if (pts.length) { pts.push(...p); segs.push(null); } else pts.push(...p);
      segs.push(...s);
    }
    return { pts, segs };
  }

  /* ---------- Packet: 3D cube with a glowing core and a label chip ---------- */
  const LOCK = c => `<svg width="10" height="12" viewBox="0 0 10 12"><rect x="0.5" y="5" width="9" height="6.5" rx="1.2" fill="${c}"/><path d="M2.3 5V3.4a2.7 2.7 0 0 1 5.4 0V5" fill="none" stroke="${c}" stroke-width="1.4"/></svg>`;
  const UNLOCK = c => `<svg width="10" height="12" viewBox="0 0 10 12"><rect x="0.5" y="5" width="9" height="6.5" rx="1.2" fill="${c}"/><path d="M2.3 5V3.4a2.7 2.7 0 0 1 5.3-.6" fill="none" stroke="${c}" stroke-width="1.4"/></svg>`;
  const COLORS = { tls: '#38BDF8', mtls: '#A78BFA', open: '#FBBF24', ok: '#34D399', bad: '#F43F5E', attack: '#FB7185', dns: '#F472B6', priv: '#2DD4BF' };
  const LOCKED = new Set(['tls', 'mtls', 'priv']);
  class Packet {
    constructor(stage, parent, { size = 36 } = {}) {
      this.stage = stage; this.size = size; this.p = [0, -60, 0]; this.visible = false;
      this.g = el('div', 'fk-n', parent);
      this.sc = el('div', 'fk-n', this.g);          // scale (appear / vanish)
      this.spin = el('div', 'fk-n', this.sc);       // ambient spin
      stage.spinners.push({ el: this.spin, speed: .1 });
      this.faces = [];
      const s = size, tf = ['', 'rotateY(180deg)', 'rotateY(90deg)', 'rotateY(-90deg)', 'rotateX(90deg)', 'rotateX(-90deg)'];
      for (const t of tf) {
        const w = g(this.spin, 0, 0, 0, t), f = el('div', 'fk-n', w);
        const pl = plane(f, { w: s, h: s, t: `translateZ(${s / 2}px)`, two: true });
        pl.style.borderRadius = '6px';
        this.faces.push({ f, pl });
      }
      this.core = stage.billboard(this.g, '<div class="fk-core"></div>', { p: [0, 0, 0] });
      this.dot = this.core.el.firstChild;
      this.chip = stage.billboard(null, '', { screen: true, p: () => [this.p[0], this.p[1] - s - 6, this.p[2]] });
      this.bs = { s: 'tls', text: '', sub: '' };
      stage.onFrame.push(() => { this.g.style.transform = `translate3d(${this.p[0]}px,${this.p[1]}px,${this.p[2]}px)`; });
      stage.onReset(() => { this._vis(false); this.setState({ s: 'tls', text: '', sub: '' }); });
      this.setState(this.bs); this._vis(false);
    }
    _vis(v) { this.visible = v; this.g.style.display = v ? '' : 'none'; this.chip.el.style.display = v ? '' : 'none'; }
    setState({ s, text, sub }) {
      const c = COLORS[s] || s;
      for (const q of this.faces) { q.pl.style.background = `${c}33`; q.pl.style.border = `2px solid ${c}`; q.pl.style.boxShadow = `0 0 14px ${c}88, inset 0 0 12px ${c}55`; }
      this.dot.style.background = `radial-gradient(circle at 40% 35%,#fff,${c} 60%)`; this.dot.style.boxShadow = `0 0 18px 4px ${c}`;
      this.chip.el.innerHTML = text ? `<div class="fk-chip" style="--pc:${c}">${LOCKED.has(s) ? LOCK(c) : UNLOCK(c)}<span>${text}</span>${sub ? `<small>${sub}</small>` : ''}</div>` : '';
    }
    // text / sub left undefined keep their previous values
    state_(tl, pos, s, text, sub) {
      const v = this.bs = { s, text: text ?? this.bs.text, sub: sub ?? this.bs.sub };
      tl.set(this, 'state', pos, v, x => this.setState(x), { s: 'tls', text: '', sub: '' });
      return pos;
    }
    _place(tl, pos, dur, ez, val) { tl.fn(this, 'pos', pos, dur, ez, val, p => { this.p = p; }); }
    _show(tl, pos, v) { tl.set(this, 'vis', pos, v, x => this._vis(x), false); }
    appear(tl, pos, p, s = 'tls', text, sub) {
      this._place(tl, pos, 0, 'linear', () => [...p]);
      this.state_(tl, pos, s, text ?? '', sub ?? '');
      tl.add(this.faces.map(q => q.f), { z: [0, 0], opacity: [1, 1], duration: 0 }, pos);
      tl.add(this.dot, { scale: [1, 1], opacity: [1, 1], duration: 0 }, pos);
      this._show(tl, pos, true);
      tl.add(this.sc, { scale: [0, 1], duration: 400, ease: 'outBack(1.6)' }, pos);
      return pos + 400;
    }
    vanish(tl, pos) { tl.add(this.sc, { scale: [1, 0], duration: 250, ease: 'inQuad' }, pos); this._show(tl, pos + 260, false); return pos + 260; }
    // Move along a route ({pts, segs}) lighting the link segments it passes
    travel(tl, pos, r, dur, { cls = 'lit', ease: ez = 'inOutSine' } = {}) {
      const path = pathFn(r.pts), E = ease(ez);
      this._place(tl, pos, dur, ez, k => path.at(k).p);
      if (r.segs) r.segs.forEach((s, k) => { if (s && path.segs[k]) segState(tl, s, pos + dur * invEase(E, path.segs[k].start / path.total), cls); });
      return pos + dur;
    }
    // TLS break: the cube opens up so the payload can be inspected
    open(tl, pos) {
      this.state_(tl, pos, 'open');
      tl.add(this.faces.map(q => q.f), { z: [0, 26], duration: 450, ease: 'outBack(1.4)' }, pos);
      return pos + 450;
    }
    seal(tl, pos, s = 'mtls', text, sub) {
      tl.add(this.faces.map(q => q.f), { z: [26, 0], duration: 400, ease: 'inBack(1.4)' }, pos);
      this.state_(tl, pos + 380, s, text, sub);
      return pos + 400;
    }
    shatter(tl, pos) {
      this.state_(tl, pos, 'bad');
      tl.add(this.faces.map(q => q.f), { z: (f, i) => 80 + ((i * 53) % 7) * 20, opacity: [1, 0], duration: 700, ease: 'outCubic' }, pos + 150);
      tl.add(this.dot, { scale: [1, 2.5], opacity: [1, 0], duration: 500, ease: 'outQuad' }, pos + 150);
      this._show(tl, pos + 900, false);
      return pos + 900;
    }
  }

  /* ---------- Drill: a node "slides out" into its deployment view; a token walks its internal stages ---------- */
  // o: { at, dx, dy, w, title, sub, frame, lanes: [{ label | box, h, stages: [{label, sub, items}] }], panel: {lane, x, w} }
  // Stage and check states are tracks, so runs can be replayed, scrubbed and reversed like everything else.
  class Drill {
    constructor(stage, o) {
      this.stage = stage; this.o = o;
      const SW = o.sw || 148, GAP = o.gap || 20, PAD = 18, W = o.w;
      const parts = []; this.lanes = [];
      let y = 66;
      o.lanes.forEach((ln, li) => {
        const h = ln.h || 120;
        if (ln.box) { parts.push(`<div class="box" style="left:${PAD - 9}px;top:${y}px;width:${W - 2 * PAD + 18}px;height:${h + 40}px"><span>${ln.box}</span></div>`); y += 30; }
        else if (ln.label) { parts.push(`<div class="lnl" style="left:${PAD}px;top:${y}px">${ln.label}</div>`); y += 18; }
        const top = y, xs = ln.stages.map((_, i) => PAD + i * (SW + GAP));
        ln.stages.forEach((st, i) => {
          if (i) parts.push(`<i class="ar" style="left:${xs[i] - GAP}px;top:${top + 22}px;width:${GAP}px"></i>`);
          parts.push(`<div class="st" data-l="${li}" style="left:${xs[i]}px;top:${top}px;width:${SW}px;height:${h}px"><div class="nm">${st.label}</div><div class="sb">${st.sub || ''}</div>` +
            (st.items || []).map(x => `<div class="ck"><b></b><span>${x}</span></div>`).join('') + `<div class="note"></div></div>`);
        });
        this.lanes.push({ top, h, xs, rowY: top + 22 });
        y = top + h + (ln.box ? 22 : 28);
      });
      const H = y;
      if (o.panel) {
        const first = this.lanes[0], last = this.lanes[this.lanes.length - 1], ln = this.lanes[o.panel.lane ?? 0];
        const top = o.panel.full ? first.top : ln.top, h = o.panel.full ? last.top + last.h - first.top : ln.h;
        parts.push(`<div class="pl" style="left:${o.panel.x}px;top:${top}px;width:${o.panel.w}px;height:${h}px"></div>`);
      }
      Object.assign(this, { SW, W, H });
      const dx = o.dx ?? 60, dy = o.dy ?? -(H + 60);
      const html = `<div class="fk-dwrap" style="transform:translate(${dx}px,${dy}px)">
          <svg class="lead" width="${Math.abs(dx) + 10}" height="${Math.abs(dy) + 10}" style="left:${-dx}px;top:${H}px;position:absolute;overflow:visible"><line x1="0" y1="${-dy - H}" x2="${dx}" y2="0" /></svg>
          <div class="fk-drill" style="width:${W}px;height:${H}px">
            <div class="dh"><b>${o.title}</b><span>${o.sub || ''}</span></div><div class="fr">${o.frame || ''}</div>
            ${parts.join('')}<div class="tok"></div>
          </div></div>`;
      this.bb = stage.billboard(null, html, { screen: true, p: o.at });
      const q = sel => [...this.bb.el.querySelectorAll(sel)];
      this.card = q('.fk-drill')[0]; this.lead = q('.lead')[0]; this.tok = q('.tok')[0]; this.pl = q('.pl')[0];
      const sts = q('.st'); let n = 0;

      stage.onReset(() => { this._vis(false); sts.forEach(e => { e.className = 'st'; e.querySelector('.note').textContent = ''; }); q('.ck').forEach(e => { e.className = 'ck'; }); this.tok.className = 'tok'; if (this.pl) this.pl.innerHTML = ''; });
    }
    _vis(v) { this.bb.el.style.display = v ? '' : 'none'; }
    pos([l, i]) { const ln = this.lanes[l]; return [ln.xs[i] + this.SW / 2, ln.rowY]; }
    stState(tl, pos, li, v, note = '') { const e = this.st[li[0]][li[1]]; tl.set(e, 'st', pos, [v, note], ([x, nt]) => { e.className = 'st' + (x ? ' ' + x : ''); e.querySelector('.note').textContent = nt; }, ['', '']); return pos; }
    ckState(tl, pos, e, v) { tl.set(e, 'ck', pos, v, x => { e.className = 'ck' + (x ? ' on ' + x : ''); }, ''); return pos; }
    tokState(tl, pos, v) { tl.set(this.tok, 'cls', pos, v, x => { this.tok.className = 'tok' + (x ? ' ' + x : ''); }, ''); return pos; }
    panel(tl, pos, html) { if (this.pl) tl.set(this.pl, 'html', pos, html, x => { this.pl.innerHTML = x; }, ''); return pos; }
    clear(tl, pos) {
      this.st.flat().forEach((e, k) => { tl.set(e, 'st', pos, ['', ''], ([x, nt]) => { e.className = 'st' + (x ? ' ' + x : ''); e.querySelector('.note').textContent = nt; }, ['', '']); e.querySelectorAll('.ck').forEach(c => this.ckState(tl, pos, c, '')); });

    // Visit a stage: move there, light it, tick each check with its status ('pass' | 'fail' | 'skip'), then settle
    visit(tl, pos, li, { st, verdict, tick = 420, hold = 450, keep = false, note = '' } = {}) {

  /* ---------- Dot: a small glowing token with a fading tail, for subtle flows (e.g. DNS lookups) ---------- */
  class Dot {
    constructor(stage, parent, { color = '#E2E8F0', size = 11, tail = 5, lag = .018 } = {}) {
      this.p = [0, 0, 0]; this.path = null; this.k = 0; this.visible = false;
      const mk = (sz, op) => stage.billboard(parent, `<div class="fk-dot" style="--c:${color};width:${sz}px;height:${sz}px;margin:${-sz / 2}px 0 0 ${-sz / 2}px;opacity:${op}"></div>`, { p: [0, 0, 0] });
      this.head = mk(size, 1); this.head.p = () => this.p;
      this.tail = Array.from({ length: tail }, (_, i) => {
        const b = mk(size * (1 - (i + 1) / (tail + 1.5)), .55 * (1 - i / tail));
        b.p = () => this.path ? this.path.at(Math.max(0, this.k - lag * (i + 1))).p : this.p;
        return b;
      });
      this._vis(false); stage.onReset(() => this._vis(false));
    }
    _vis(v) { this.visible = v; [this.head, ...this.tail].forEach(b => { b.el.style.display = v ? '' : 'none'; }); }
    show(tl, pos, v) { tl.set(this, 'vis', pos, v, x => this._vis(x), false); return pos; }
    travel(tl, pos, pts, dur, ez = 'inOutSine') {
      const path = pathFn(pts), E = ease(ez);
      tl.fn(this, 'pos', pos, dur, 'linear', k => [path, E(k)], ([pa, kk]) => { this.path = pa; this.k = kk; this.p = pa.at(kk).p; });
      return pos + dur;
    }
  }

  /* ---------- Effects ---------- */
  function ring(stage, parent, tl, pos, p, color = '#38BDF8', size = 140) {
    const b = stage.billboard(parent, `<div style="width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px;border-radius:50%;border:3px solid ${color};box-shadow:0 0 16px ${color}"></div>`, { p });
    b.el.style.display = 'none'; tl.own(() => stage.removeBillboard(b));
    const vis = v => { b.el.style.display = v ? '' : 'none'; };
    tl.set(b, 'vis', pos, true, vis, false); tl.set(b, 'vis', pos + 900, false);
    tl.add(b.el.firstChild, { scale: [.15, 1.6], opacity: [1, 0], duration: 900, ease: 'outQuad' }, pos);
    return pos;
  }
  // Small token flying from a to b (spans to the obs wall, cookies, bot swarms...)
  function fly(stage, parent, tl, pos, a, b, { color = '#A78BFA', dur = 900, size = 10, arc: h = -200, html, ease: ez = 'inOutSine' } = {}) {
    const o = { t: 0 };
    const d = stage.billboard(parent, html || `<div style="width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px;border-radius:50%;background:${color};box-shadow:0 0 10px 2px ${color}"></div>`,
      { p: () => { const p = lerp3(a, b, o.t); p[1] += h * Math.sin(Math.PI * o.t); return p; } });
    d.el.style.display = 'none'; tl.own(() => stage.removeBillboard(d));
    const vis = v => { d.el.style.display = v ? '' : 'none'; };
    tl.set(d, 'vis', pos, true, vis, false); tl.set(d, 'vis', pos + dur, false);
    tl.add(o, { t: [0, 1], duration: dur, ease: ez }, pos);
    return pos + dur;
  }

  /* ---------- Detail: level of detail for a device ---------- */
  // When you take the camera (zoom, orbit, pan) and close in on a device, the device sinks away and a detailed
  // sub-scene grows in its place. It follows the camera only, never the timeline, so scripted playback is unchanged.
  //   new Detail(stage, device, ({ g, box, label, outline, flow }) => { ...build in world coordinates... }, { near, far, at })
  // near / far: camera distance (zoom distance plus how far the view centre is from the device) where the detail is
  // fully shown / starts to appear.
  const d0 = d => d.g.style.display !== 'none';
  class Detail {
    constructor(stage, dev, build, { near = 1300, far = 2300, at, hide = [], links = [], tags = [], walls = [], card, title = '', shot } = {}) {
      // hide: other devices the detail replaces; links: cables whose job the detail's own flow lines take over
      // title, shot: how it is listed under "Deployment diagrams" in the player, and the camera that opens it
      Object.assign(this, { stage, dev, near, far, hide, links, tags, walls, title, f: 0, c: at || [dev.x, 0, dev.z], labels: [] });   // walls: firewalls the wider view spills across   // tags: overlay labels of what it replaces
      this.shot = shot || { x: this.c[0], y: -60, z: this.c[2], rx: -55, ry: 0, d: near * .95 };
      this.g = g(stage.world, 0, 0, 0); this.g.classList.add('fk-lod'); this.g.style.display = 'none';
      // card: the layer tile lifts out of the floor and grows to the detail's footprint, the detail sitting on top of it.
      //   { from: [x1, z1, x2, z2] the tile it starts as, to: [x1, z1, x2, z2] its full size, lift, color }
      if (card) {
        const [x1, z1, x2, z2] = card.to, w = x2 - x1, d = z2 - z1, t = 16, col = card.color || '#22D3EE', rgba = rgbaOf(col);
        this.card = { ...card, lift: card.lift ?? 45, w, d };
        this.cardShadow = el('div', 'fk-n fk-lod', stage.world); this.cardShadow.style.display = 'none';
        plane(this.cardShadow, { w: w + 80, h: d + 80, t: 'translateY(-1px) rotateX(90deg)', bg: 'radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,.25) 70%, transparent)' });
        this.cardG = el('div', 'fk-n fk-lod', stage.world); this.cardG.style.display = 'none';
        const slab = box(this.cardG, { y: t / 2, w, h: t, d, c: '#0B1626' });
        slab.top.style.background = `linear-gradient(180deg, ${rgba(.10)}, ${rgba(.04)}), #0A1422`;
        slab.top.style.boxShadow = `inset 0 0 0 3px ${rgba(.75)}, 0 0 40px ${rgba(.35)}`;
        for (const k of ['front', 'back', 'left', 'right']) slab[k].style.boxShadow = `inset 0 3px 0 ${rgba(.6)}`;
      }
      const G = this.g;
      build({
        g: G,
        box: o => box(G, o),
        outline: o => outline(stage, G, o),
        label: (p, html, cls = '') => { const b = stage.billboard(null, `<div class="fk-label lod ${cls}">${html}</div>`, { screen: true, p }); b.el.style.display = 'none'; this.labels.push(b); return b; },
        // an animated flow line along the floor (or at height y) from a to b
        flow: (a, b, color = '#22D3EE', w = 6) => { const n = el('div', 'fk-n fk-lodflow', G); n.style.transform = orient(a, b); n.style.setProperty('--pc', color); plane(n, { w, h: 100, t: 'rotateX(90deg)', two: true, bg: '' }); return n; },
        // a dashed group box with its header (icon square + title) lying on the floor in the top-left (back-left)
        // corner, the usual convention for AWS deployment diagrams. icon: SVG markup; iconBg: tile colour behind it
        group: ({ x1, z1, x2, z2, color, icon, iconBg = 'transparent', title = '', sub = '', hw = 260, hh = 44, width = 4, dash = '12 8', fill = .03 }) => {
          outline(stage, G, { pts: [[x1, z1], [x2, z1], [x2, z2], [x1, z2]], color, width, dash, fill });
          plane(G, { w: hw, h: hh, t: `translate3d(${x1 + hw / 2}px,-3px,${z1 + hh / 2}px) rotateX(90deg)`,
            html: `<div class="fk-ghead" style="--gc:${color};--gb:${iconBg}">${icon ? `<span class="gi">${icon}</span>` : ''}<span class="gt"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span></div>` });
        },
        // a flat label printed on the floor, centred on (x, z), like the text under an icon in a 2D diagram
        tag: ({ x, z, text, sub = '', w = 160, h = 40, size = 15, align = 'center' }) => plane(G, { w, h, t: `translate3d(${x}px,-2px,${z}px) rotateX(90deg)`,
          html: `<div class="fk-ftag" style="font-size:${size}px;text-align:${align};justify-content:${align === 'left' ? 'flex-start' : 'center'}"><div>${text}${sub ? `<small>${sub}</small>` : ''}</div></div>` }),
        // a logo tile lying on top of a 3D box (y: height of the box top, negative up)
        iconTop: ({ x, y, z, icon, size = 34, bg = '#fff' }) => plane(G, { w: size, h: size, t: `translate3d(${x}px,${y - 1}px,${z}px) rotateX(90deg)`, html: `<div class="fk-itop" style="background:${bg}">${icon}</div>` })

    }
    update(cam, free) {

      const goal = free && d0(this.dev) ? clamp((this.far - reach) / (this.far - this.near), 0, 1) : 0;   // only for a device that is on stage
      this.f += (goal - this.f) * .06; if (Math.abs(goal - this.f) < .003) this.f = goal;   // eased: things change slowly as you move in

      this.g.style.transform = `translate3d(${cx}px,${-lift}px,${cz}px) scale3d(${s},${s},${s}) translate3d(${-cx}px,0,${-cz}px)`;
      this.g.style.setProperty('--lod', f.toFixed(3));

      const k = clamp(1 - f * 1.4, 0, 1);   // the device has gone by the time the detail is two-thirds in
      for (const q of [d, ...this.hide]) {
        q.g.style.transform = `translate3d(${q.x}px,0,${q.z}px)` + (k < 1 ? ` scale3d(${k.toFixed(3)},${k.toFixed(3)},${k.toFixed(3)})` : '');
        q.g.style.visibility = k < .02 ? 'hidden' : '';
        q.labelBB.el.style.opacity = k < 1 ? k.toFixed(3) : '';
      }
      for (const b of this.tags) b.el.style.opacity = k < 1 ? k.toFixed(3) : '';
      for (const w of this.walls) {
        for (const pl of w.parts) { pl.style.opacity = k < 1 ? k.toFixed(3) : ''; pl.style.visibility = k < .02 ? 'hidden' : ''; }
        if (w.labelBB) w.labelBB.el.style.opacity = k < 1 ? k.toFixed(3) : '';
      }
      for (const l of this.links) for (const sg of l.segs) {
        sg.style.visibility = k < .02 ? 'hidden' : '';
        sg.querySelectorAll('.fk-f').forEach(fc => { fc.style.opacity = k < 1 ? k.toFixed(3) : ''; });
      }
      const lo = clamp((f - .4) / .6, 0, 1);
      for (const b of this.labels) { b.el.style.display = lo > 0 ? '' : 'none'; b.el.style.opacity = lo.toFixed(3); }
    }
  }

<script>
/*
 * Scene: CIB unified ingress, from the DNS control plane to the internal network.
 *
 *   L0 DNS control plane      JPMorgan primary + Cloudflare secondary nameservers, Akamai GTM, Cloudflare LB. Ahead of the request path
 *   L1 Client                 Browser · Mobile app · API client · Delegated agent · Autonomous agent · M2M
 *   L2 Edge protection / CDN  Akamai, Cloudflare: classify callers, do not establish identity
 *   L3 Regional perimeter     PSaaS+ (on-prem) · AWS WAF (AWS): CDN traffic only
 *   L4 Enforcement tier       Tier 2, the DMZ gateway inside SESF on both substrates (Envoy / Kong): the single enforcement point
 *   L5 IFA workload zone      application workloads on GKP and EKS, reachable only from L4 over mTLS
 *   L6 Internal network       downstream services, systems of record, session and signal managers, broker, config pipeline
 *
 *   P1 Private connectivity   VAN / private circuit / leased line to BP PSaaS, entering at L3
 *   P2 Cloud private conn.    AWS PrivateLink from a partner VPC to our endpoint service, entering at L4
 *
 * Everything you may want to correct lives in LAYERS, NAMES, FOOTPRINT, ROLES and CHECKS below.
 * Layout: layers run left to right along x; on-prem / Akamai is the back lane (z < 0), cloud / Cloudflare the front lane (z > 0).
 */
(function () {
  const FK = window.FlowKit;
  const { Stage, Trace, ObsWall, Device, Wall, Link, Packet, zone, outline, ring, fly, route, arc, Player } = FK;

  /* ---------- the layers ---------- */
  // Columns along x: X[0] the clients (L1), X[1] the (narrow) internet band, X[2]..X[6] L2..L6. L0 is the DNS box left of the clients.
  const X = [-1755, -1230, -700, 0, 700, 1400, 2100];
  const IW = 175;                                        // internet band half-width
  const LAYERS = [
    { name: 'DNS control plane', alias: 'Steering', color: '#F472B6', desc: 'Resolves the hostname to an edge address before any request is made, chosen by location, latency, load and health. 4 JPMorgan primary and 3 Cloudflare secondary nameservers, with Akamai GTM and Cloudflare Load Balancing steering. No traffic flows through it; steering changes are bounded by TTL and resolver caching' },
    { name: 'Client', alias: 'Untrusted', color: '#94A3B8', desc: 'Browsers, mobile apps, API clients, delegated agents, autonomous agents and M2M callers, over the internet or private connectivity. Untrusted regardless of type; each holds a sender-constrained credential bound to a key it controls' },
    { name: 'Edge protection / CDN', alias: 'Edge', color: '#F97316', desc: 'Akamai and Cloudflare, active-active from one source ruleset. Terminates TLS, caches, absorbs volumetric attack, applies WAF, bot and agent classification, geographic policy and per-client rate limits. Classifies callers; does not establish identity' },
    { name: 'Regional perimeter', alias: 'Perimeter', color: '#FBBF24', desc: 'PSaaS+ on-prem (9 data centres) and AWS WAF in AWS (8 regions). Admits only traffic from the CDN, which is what makes origin lockdown enforceable; a second WAF pass and perimeter traffic policy' },
    { name: 'Enforcement tier', alias: 'SESF · Tier 2', color: '#22D3EE', desc: 'The DMZ gateway on both substrates, inside SESF. The single enforcement point: breaks and inspects TLS, resolves the credential to live state, exchanges tokens, runs the global and route policies, enforces scopes, mandates and lifetimes, consumes revocation and risk signals and injects verified identity. Fails closed' },
    { name: 'IFA workload zone', alias: 'Workloads', color: '#818CF8', desc: 'Isolated firewall application zone: application workloads on GKP and EKS, reachable only from L4 and only over mutual TLS. Receives verified identity as headers rather than parsing tokens' },
    { name: 'Internal network', alias: 'Trusted services', color: '#34D399', desc: 'Downstream services, systems of record, the identity platform\'s session and signal managers, the message broker, the configuration pipeline and the observability stack. Identity is propagated rather than re-asserted' }
  ].map((L, i) => { const x = i === 1 ? X[0] : X[i]; return { ...L, i, x1: x - 350, x2: x + 350, shot: { x, y: -190, z: 60, rx: -30, ry: -16, d: 3300 } }; });
  // L0 is a box to the left of the clients, ahead of the request path rather than in it
  const DNSB = { x1: -3215, x2: -2155, ns: -2915, sr: -2465, za: -530, zc: 520, nz: [-740, -600, -460, -320, 380, 520, 660] };
  const NJ = 4;   // ns1..ns4 are JPM (primary), ns5..ns7 Cloudflare (secondary)
  Object.assign(LAYERS[0], { x1: DNSB.x1, x2: DNSB.x2, shot: { x: -2605, y: -180, z: 60, rx: -34, ry: 24, d: 3500 } });
  // Private connectivity: not a numbered layer. Corridors outside the internet path:
  // P1 on-prem (back corridor), P2 the partner VPC (front)
  const PZ = { on: -1260, aws: 1265 };             // back corridor centre line; partner VPC centre line (z)
  const P = LAYERS.push({ tag: 'P', name: 'Private connectivity', alias: 'P1 · P2', color: '#2DD4BF',
    desc: 'Paths that skip part of the internet route. P1: VAN, private circuit or leased line to BP PSaaS, entering at L3. P2: AWS PrivateLink from a partner VPC to our endpoint service, entering at L4. The client is still L1 and still carries a credential',
    test: q => Math.abs(q[2]) > 1040, shot: { x: -300, y: -80, z: 0, rx: -62, ry: 0, d: 8200 } }) - 1;

  const NAMES = {
    browser: ['Browser', 'our web app'],
    mobile: ['Mobile app', 'our iOS / Android app'],
    api: ['API client', '3rd party app · for a user'],
    dagent: ['Delegated agent', 'acts for a user'],
    aagent: ['Autonomous agent', 'own mandate · no user'],
    m2m: ['M2M', 'workload identity · no user'],
    ns1: ['ns1.jpmorganchase.com', 'JPMorgan DNS · primary'],
    ns2: ['ns2.jpmorganchase.com', 'JPMorgan DNS · primary'],
    ns3: ['ns05.jpmorganchase.com', 'JPMorgan DNS · primary'],
    ns4: ['ns06.jpmorganchase.com', 'JPMorgan DNS · primary'],
    ns5: ['ns0098.secondary.cloudflare.com', 'Cloudflare DNS · secondary'],
    ns6: ['ns0134.secondary.cloudflare.com', 'Cloudflare DNS · secondary'],
    ns7: ['ns0221.secondary.cloudflare.com', 'Cloudflare DNS · secondary'],
    steerA: ['Akamai GTM', 'smart routing · DNS'],
    steerC: ['Cloudflare LB', 'smart routing · DNS'],
    cdnA: ['Akamai Edge (WAF/CDN)', 'edge protection · 4,100+ PoPs'],
    cdnC: ['Cloudflare Edge (WAF/CDN)', 'edge protection · 310+ cities'],
    psaas: ['PSaaS+', 'on-prem regional perimeter'],
    waf: ['AWS WAF', 'public cloud regional perimeter'],
    t2: ['T2 gateway · on-prem', 'Envoy / Kong · SESF'],
    t2c: ['T2 gateway · AWS', 'Envoy / Kong · EKS'],
    bpOn: ['Institutional client', 'VAN · private circuit'],
    bpAws: ['Partner service', '3rd party\'s own AWS VPC'],
    eni: ['Interface endpoint', 'ENI in the partner VPC'],
    bpp: ['BP PSaaS', 'P1 entry · L3 · on-prem'],
    pl: ['Endpoint service', 'P2 · PrivateLink + NLB'],
    wlOn: ['Workloads · GKP', 'IFA zone · on-prem'],
    wlCl: ['Workloads · EKS', 'IFA zone · AWS'],
    sess: ['Session manager', 'identity platform'],
    svc: ['Downstream services', 'internal network'],
    sig: ['Signal manager', 'identity platform · SSF'],
    broker: ['Message broker', 'signals and events'],
    sor: ['Systems of record', 'internal network'],
    cfg: ['Config pipeline', 'and register'],
    attacker: ['Attacker', 'direct-to-origin probe'],
    obs: 'Observability plane',
    w1: 'L3 perimeter · CDN origin traffic only',
    w2: 'SESF · enforcement tier',
    w3: 'IFA zone firewall · mTLS from L4 only',
    w4: 'Internal network'
  };
  const FOOTPRINT = {
    akamai: { label: '4,100+ PoPs', NA: 1600, EMEA: 1100, APAC: 750 },
    cloudflare: { label: '310+ cities', NA: 95, EMEA: 105, APAC: 85 },
    psaas: { label: '9 DCs', NA: 3, EMEA: 2, APAC: 4 },
    waf: { label: '8 regions', NA: 3, EMEA: 3, APAC: 2 },
    t2: { label: '9 DCs', NA: 4, EMEA: 2, APAC: 3 }
  };
  const ROLES = {
    browser: 'Our web application in the user\'s browser. Presents a signed session artefact (cookie) or opaque reference, which L4 resolves to live session state.',
    mobile: 'Our native iOS and Android apps. Present a key-bound access token, resolved at L4 to live session state and device binding.',
    api: 'A customer\'s or partner\'s application acting for a user. Presents a delegated access token, DPoP or certificate bound; L4 resolves it to the user\'s grant and consented scopes. mTLS terminates at L4.',
    dagent: 'An AI agent acting for a specific user. Presents an exchanged agent-scoped token (sub = user, act = agent); L4 resolves the delegation, with the user\'s entitlements as the ceiling. Step-up goes back to the user.',
    aagent: 'An AI agent transacting in its own right under a mandate from its owner. Presents its agent credential plus a signed request; L4 resolves the registered agent and its live mandate. mTLS terminates at L4.',
    m2m: 'A system calling as itself, with no user. Presents client credentials or a signed assertion; L4 resolves workload identity and fixed scopes. mTLS terminates at L4.',
    steerA: 'Akamai Global Traffic Management. Answers DNS lookups (through the client\'s resolver) with the best healthy edge, judged by location (resolver IP or EDNS client subnet), latency, load and health. Can steer to Akamai or to Cloudflare. Never in the request path.',
