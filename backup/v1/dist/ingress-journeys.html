<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingress Journeys</title>
<style>
/* FlowKit: 3D architecture animation kit (anime.js v4 + CSS 3D) */
.fk-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #060B17;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #E2E8F0; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.fk-scaler { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.fk-stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 50%; overflow: hidden;
  background: radial-gradient(ellipse at 50% 20%, #13264A 0%, #0A1530 50%, #050A16 100%); }
.fk-world { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
.fk-n { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.fk-f { position: absolute; box-sizing: border-box; backface-visibility: hidden; }
.fk-f.two { backface-visibility: visible; }
.fk-bb { position: absolute; left: 0; top: 0; }
.fk-ov, .fk-hud { position: absolute; inset: 0; pointer-events: none; }
.fk-dip { position: absolute; inset: 0; background: #050A16; opacity: 0; pointer-events: none; }

/* Devices */
.fk-dev { --led: #34D399; --accent: #38BDF8; }
.fk-dev .fk-f { box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .28); }
.fk-dev .fk-glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, var(--led), transparent); opacity: .35; }
.fk-ledstrip { position: absolute; width: 5px; background: repeating-linear-gradient(180deg, var(--led) 0 5px, transparent 5px 16px); filter: drop-shadow(0 0 3px var(--led)); }
.fk-slots { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: repeating-linear-gradient(180deg, transparent 0 14px, rgba(148, 163, 184, .14) 14px 16px); }
.fk-n.err .fk-f.f-front, .fk-n.err .fk-f.f-top { background-color: #7F1D1D !important; }
.fk-dev.down .fk-f.f-front, .fk-dev.down .fk-f.f-top { background-color: #3B1220 !important; }

/* Links */
.fk-link .fk-f { background: #2E5E96; transition: background-color .25s, box-shadow .25s; }
.fk-link.lit .fk-f { background: #38BDF8; box-shadow: 0 0 12px #38BDF8; }
.fk-link.mtls .fk-f { background: #A78BFA; box-shadow: 0 0 12px #A78BFA; }
.fk-link.ok .fk-f { background: #34D399; box-shadow: 0 0 12px #34D399; }
.fk-link.bad .fk-f { background: #F43F5E; box-shadow: 0 0 12px #F43F5E; }
.fk-link.dead .fk-f { background: #3A2430; }

/* Zones */
.fk-zlabel { font: 700 44px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.fk-zlabel small { display: block; font-size: 22px; letter-spacing: .06em; font-weight: 500; margin-top: 8px; opacity: .8; text-transform: none; }

/* Screen-space labels */
.fk-label { transform: translate(-50%, -100%); white-space: nowrap; background: rgba(8, 15, 32, .86); border: 1px solid rgba(125, 211, 252, .35);
  border-radius: 7px; padding: 4px 9px; font-size: 12px; color: #E2E8F0; display: flex; align-items: center; gap: 7px; transition: border-color .3s, box-shadow .3s; }
.fk-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--led, #34D399); box-shadow: 0 0 6px var(--led, #34D399); flex: none; }
.fk-label .sub { display: none; color: #7DD3FC; font-size: 11px; }
.fk-label.active { border-color: #7DD3FC; box-shadow: 0 0 18px rgba(56, 189, 248, .45); }
.fk-label.active .sub { display: inline; }
.fk-label.dim { opacity: .45; }

/* Packet chip */
.fk-chip { transform: translate(-50%, -100%); white-space: nowrap; background: rgba(8, 15, 32, .92); border-radius: 6px; padding: 4px 8px;
  font: 600 11px ui-monospace, Menlo, monospace; color: #E0F2FE; border: 1px solid var(--pc, #38BDF8); display: flex; align-items: center; gap: 6px; }
.fk-chip small { font: 500 10px system-ui, sans-serif; color: #94A3B8; }

/* Panels (checklists, payload) */
.fk-panel { position: absolute; min-width: 240px; background: rgba(8, 15, 32, .94); border: 1px solid rgba(125, 211, 252, .4); border-radius: 10px;
  padding: 10px 12px; font-size: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
.fk-panel h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #7DD3FC; }
.fk-panel .it { display: flex; gap: 8px; align-items: center; padding: 3px 0; opacity: .25; transition: opacity .25s; }
.fk-panel .it.on { opacity: 1; }
.fk-panel .it b { width: 16px; height: 16px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10px; background: #1E293B; color: #0B1220; }
.fk-panel .it.on.pass b { background: #34D399; }
.fk-panel .it.on.fail b { background: #F43F5E; color: #fff; }
.fk-panel .it.on.warn b { background: #FBBF24; }
.fk-panel .res { margin-top: 6px; padding-top: 6px; border-top: 1px solid #1E293B; font-weight: 600; opacity: 0; transition: opacity .3s; }
.fk-panel .res.on { opacity: 1; }
.fk-panel pre { margin: 0; font: 11px/1.45 ui-monospace, Menlo, monospace; color: #CBD5E1; }
.fk-panel pre .hl { background: rgba(56, 189, 248, .18); }
.fk-panel pre .bad { background: rgba(244, 63, 94, .28); color: #FECDD3; }

/* HUD: caption + trace */
.fk-caption { position: absolute; left: 24px; bottom: 22px; max-width: 640px; background: rgba(8, 15, 32, .86); border: 1px solid rgba(125, 211, 252, .2);
  padding: 11px 15px; border-radius: 10px; }
.fk-caption .st { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #7DD3FC; }
.fk-caption .tx { font-size: 17px; margin-top: 3px; color: #F1F5F9; }
.fk-trace { position: absolute; right: 18px; top: 16px; width: 360px; background: rgba(8, 15, 32, .86); border: 1px solid rgba(167, 139, 250, .35);
  border-radius: 10px; padding: 10px 12px; font-size: 11px; }
.fk-trace h4 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #C4B5FD; display: flex; justify-content: space-between; }
.fk-trace .tid { font: 10px ui-monospace, Menlo, monospace; color: #94A3B8; margin: 3px 0 6px; }
.fk-trace .row { display: grid; grid-template-columns: 118px 1fr 44px; gap: 6px; align-items: center; height: 17px; }
.fk-trace .svc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #CBD5E1; }
.fk-trace .lane { position: relative; height: 8px; background: rgba(148, 163, 184, .08); border-radius: 3px; }
.fk-trace .bar { position: absolute; top: 0; height: 8px; border-radius: 3px; background: #A78BFA; }
.fk-trace .bar.err { background: #F43F5E; }
.fk-trace .bar.warn { background: #FBBF24; }
.fk-trace .ms { text-align: right; color: #94A3B8; font: 10px ui-monospace, Menlo, monospace; }
.fk-trace .ms.err { color: #FDA4AF; }

/* Player */
.fk-player { display: flex; flex-direction: column; gap: 12px; width: min(100%, 1280px); }
.fk-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fk-bar button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 7px; border: 1px solid #334155; background: #111C31; color: #CBD5E1; cursor: pointer; }
.fk-bar button:hover { background: #18253F; }
.fk-bar button.on { border-color: #38BDF8; color: #F1F5F9; background: #0E2A47; }
.fk-bar .sp { flex: 1; }
.fk-prog { height: 3px; background: #1E293B; border-radius: 2px; overflow: hidden; }
.fk-prog div { height: 100%; width: 0; background: #38BDF8; }

</style>
<style>
  html, body { margin: 0; min-height: 100%; background: #040811; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #E2E8F0; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  #fk { width: min(100%, 1280px); }
  .hint { font-size: 12px; color: #64748B; }
</style>
</head>
<body>
<div class="wrap">
  <div id="fk"></div>
  <div id="controls" class="fk-player"></div>
  <div class="hint">Move the pointer over the scene to shift the camera.</div>
</div>

<script>
/*
 * FlowKit: a small kit for 3D architecture animations.
 * Built on anime.js v4 (timelines, tweens) and CSS 3D transforms.
 *
 * Coordinates: x right, y down (floor at y = 0, "up" is negative y), z towards the viewer.
 * Every timed helper takes (tl, pos, ...) and returns the time it finishes, so scripts can chain:
 *   let t = 0; t = packet.travel(tl, t, route, 1200); t = stage.checklist(tl, t, {...});

(function (global) {
  const { animate, createTimeline, utils } = anime;
  const D2R = Math.PI / 180;

  /* ---------- DOM + geometry primitives ---------- */
  function el(tag, cls, parent, html) {
    const e = document.createElement(tag || 'div');
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  function g(parent, x = 0, y = 0, z = 0, extra = '') {
    const n = el('div', 'fk-n', parent);
    n.style.transform = `translate3d(${x}px,${y}px,${z}px) ${extra}`;
    return n;
  }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt)))));
    return `rgb(${c.join(',')})`;
  }
  // Box centred at (x,y,z); "front" faces +z. faces: which faces to build (bottom rarely visible).
  function box(parent, { x = 0, y = 0, z = 0, w, h, d, c = '#1E293B', faces = 'front,back,left,right,top', cls = '', bg = {} }) {
    const b = el('div', 'fk-n ' + cls, parent);
    b.style.transform = `translate3d(${x}px,${y}px,${z}px)`;
    const defs = {
      front: [w, h, `translateZ(${d / 2}px)`, c],
      back: [w, h, `rotateY(180deg) translateZ(${d / 2}px)`, shade(c, -0.25)],
      right: [d, h, `rotateY(90deg) translateZ(${w / 2}px)`, shade(c, -0.18)],
      left: [d, h, `rotateY(-90deg) translateZ(${w / 2}px)`, shade(c, -0.08)],
      top: [w, d, `rotateX(90deg) translateZ(${h / 2}px)`, shade(c, 0.12)],
      bottom: [w, d, `rotateX(-90deg) translateZ(${h / 2}px)`, shade(c, -0.4)]
    };
    const out = { el: b };
    for (const k of faces.split(',')) {
      const [fw, fh, t, col] = defs[k];
      const f = el('div', 'fk-f f-' + k, b);
      f.style.cssText += `width:${fw}px;height:${fh}px;left:${-fw / 2}px;top:${-fh / 2}px;transform:${t};background:${bg[k] || col};`;
      out[k] = f;
    }
    return out;
  }
  function plane(parent, { w, h, t = '', bg = 'transparent', cls = '', two = false, html }) {
    const f = el('div', 'fk-f ' + cls + (two ? ' two' : ''), parent, html);
    f.style.cssText += `width:${w}px;height:${h}px;left:${-w / 2}px;top:${-h / 2}px;transform:${t};background:${bg};`;
    return f;
  }
  // Transform that stretches a z-aligned element of length L0 between points a and b
  function orient(a, b, L0 = 100) {

  /* ---------- Stage: camera, render loop, overlays ---------- */
  class Stage {
    constructor(frame, { P = 1400 } = {}) {

      this.frame = frame; frame.classList.add('fk-frame');

      this.stageEl = el('div', 'fk-stage', this.scaler);

    render() {
      const p = this.par; p.x += (p.tx - p.x) * .06; p.y += (p.ty - p.y) * .06;
      this.rx = this.cam.rx + p.y * 4; this.ry = this.cam.ry - p.x * 8;
      this.world.style.transform = `translateZ(${this.P - this.cam.d}px) rotateX(${this.rx}deg) rotateY(${this.ry}deg) translate3d(${-this.cam.x}px,${-this.cam.y}px,${-this.cam.z}px)`;
      for (const f of this.onFrame) f(this);
      for (const b of this.bbs) {
        const P = typeof b.p === 'function' ? b.p() : b.p;
        if (b.screen) {
          const q = this.project(P);

          b.el.style.visibility = '';
          const s = b.scale ? Math.max(.55, Math.min(1.4, q.s)) : 1;
          b.el.style.transform = `translate(${q.x.toFixed(1)}px,${q.y.toFixed(1)}px) scale(${s.toFixed(3)})`;
        } else {
          b.el.style.transform = `translate3d(${P[0]}px,${P[1]}px,${P[2]}px) rotateY(${-this.ry}deg) rotateX(${-this.rx}deg)`;
        }
      }
      requestAnimationFrame(this.render);
    }
    setCam(s) { Object.assign(this.cam, s); }
    // Camera move. from: optional shot to start from (use after a cut).
    shot(tl, pos, s, dur = 1500, ease = 'inOutCubic', from) {
      const p = {};
      for (const k in s) p[k] = from ? [from[k], s[k]] : s[k];
      tl.add(this.cam, { ...p, duration: dur, ease }, pos);
      return pos + dur;
    }
    dip(tl, pos, fn, { out = 300, hold = 60, back = 600 } = {}) {
      tl.add(this.dipEl, { opacity: [0, 1], duration: out, ease: 'inQuad' }, pos);

  // Build a route through several links; reverse for responses.

  /* ---------- Packet: 3D cube with a glowing core and a label chip ---------- */
  const LOCK = c => `<svg width="10" height="12" viewBox="0 0 10 12"><rect x="0.5" y="5" width="9" height="6.5" rx="1.2" fill="${c}"/><path d="M2.3 5V3.4a2.7 2.7 0 0 1 5.4 0V5" fill="none" stroke="${c}" stroke-width="1.4"/></svg>`;

      this.text = text; this.sub = sub;
      this.spinAnim = animate(this.spin, { rotateY: [0, 360], rotateX: [15, 15], duration: 3600, ease: 'linear', loop: true });
      stage.onFrame.push(() => { this.g.style.transform = `translate3d(${this.p[0]}px,${this.p[1]}px,${this.p[2]}px)`; });

    hide() { this.g.style.display = 'none'; this.chip.el.style.display = 'none'; }
    at(p) { this.p = [...p]; }
    appear(tl, pos, p, s = 'tls', text, sub) {
      tl.call(() => { this.at(p); this.setState(s, text, sub); this.faces.forEach(q => { q.f.style.transform = ''; q.f.style.opacity = ''; }); this.show(); }, pos);
      tl.add(this.spin, { scale: [0, 1], duration: 400, ease: 'outBack(1.6)' }, pos);
      return pos + 400;
    }
    vanish(tl, pos) { tl.add(this.spin, { scale: [1, 0], duration: 250, ease: 'inQuad' }, pos); tl.call(() => this.hide(), pos + 260); return pos + 260; }
    // Move along a route ({pts, segs}) lighting the link segments it passes
    travel(tl, pos, r, dur, { cls = 'lit', ease = 'inOutSine' } = {}) {
      const path = pathFn(r.pts), prog = { t: 0 };
      tl.add(prog, { t: [0, 1], duration: dur, ease, onUpdate: () => {
        const { p, i } = path.at(prog.t); this.p = p;
        if (r.segs) r.segs.forEach((s, k) => { if (s) { if (k <= i && !s.classList.contains(cls)) { s.classList.remove('lit', 'mtls', 'ok', 'bad'); s.classList.add(cls); } } });
      } }, pos);
      return pos + dur;
    }
    // TLS break: the cube opens up so the payload can be inspected
    open(tl, pos) {
      this.state_(tl, pos, 'open');
      tl.add(this.faces.map(q => q.f), { z: [0, 26], duration: 450, ease: 'outBack(1.4)' }, pos);
      return pos + 450;
    }
    seal(tl, pos, s = 'mtls', text, sub) {
      tl.add(this.faces.map(q => q.f), { z: [26, 0], duration: 400, ease: 'inBack(1.4)' }, pos);
      this.state_(tl, pos + 380, s, text, sub);
      return pos + 400;
    }
    shatter(tl, pos) {
      this.state_(tl, pos, 'bad');
      tl.add(this.faces.map(q => q.f), { z: () => 80 + Math.random() * 120, opacity: [1, 0], duration: 700, ease: 'outCubic' }, pos + 150);
      tl.call(() => { const c = this.core.el.firstChild; if (c) animate(c, { scale: [1, 2.5], opacity: [1, 0], duration: 500 }); }, pos + 150);
      tl.call(() => this.hide(), pos + 900);
      return pos + 900;
    }
  }

  /* ---------- Effects ---------- */
  function ring(stage, parent, tl, pos, p, color = '#38BDF8', size = 140) {
    let b = null;
    const kill = () => { if (b) { stage.removeBillboard(b); b = null; } };
    tl.call(() => {
      kill();
      b = stage.billboard(parent, `<div style="width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px;border-radius:50%;border:3px solid ${color};box-shadow:0 0 16px ${color}"></div>`, { p });
      animate(b.el.firstChild, { scale: [.15, 1.6], opacity: [1, 0], duration: 900, ease: 'outQuad', onComplete: kill });
    }, pos);
    stage.onReset(kill);
    return pos;
  }
  // Small token flying from a to b (spans to the obs wall, cookies to an attacker...)
  function fly(stage, parent, tl, pos, a, b, { color = '#A78BFA', dur = 900, size = 10, arc = -200, html, onArrive } = {}) {
    let d = null; const o = { t: 0 };
    const kill = () => { if (d) { stage.removeBillboard(d); d = null; } };
    tl.call(() => { kill(); d = stage.billboard(parent, html || `<div style="width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px;border-radius:50%;background:${color};box-shadow:0 0 10px 2px ${color}"></div>`, { p: [...a] }); }, pos);
    tl.add(o, { t: [0, 1], duration: dur, ease: 'inOutSine', onUpdate: () => {
      if (!d) return; const p = lerp3(a, b, o.t); p[1] += arc * Math.sin(Math.PI * o.t); d.p = p;
    } }, pos);
    tl.call(() => { kill(); onArrive && onArrive(); }, pos + dur);
    stage.onReset(kill);
    return pos + dur;
  }

  /* ---------- Player: chapters, controls ---------- */
  class Player {
    constructor(stage, host, chapters, { onBuild } = {}) {
      this.stage = stage; this.chapters = chapters; this.tl = null; this.idx = -1; this.all = false;
      const bar = el('div', 'fk-bar', host);
      this.btns = chapters.map((c, i) => { const b = el('button', '', bar, `${i + 1}. ${c.title}`); b.onclick = () => { this.all = false; this.play(i); }; return b; });
      el('div', 'sp', bar);
      const all = el('button', '', bar, 'Play all'); all.onclick = () => { this.all = true; this.play(0); };
      this.pp = el('button', '', bar, 'Pause'); this.pp.onclick = () => this.toggle();
      const rs = el('button', '', bar, 'Restart'); rs.onclick = () => this.play(Math.max(0, this.idx));
      this.prog = el('div', 'fk-prog', host, '<div></div>').firstChild;
      stage.onFrame.push(() => { if (this.tl) this.prog.style.width = (this.tl.progress * 100).toFixed(2) + '%'; });
    }
    play(i, { autoplay = true } = {}) {
      if (this.tl) { this.tl.pause(); this.tl.revert(); }
      this.stage.reset();
      this.idx = i; this.btns.forEach((b, k) => b.classList.toggle('on', k === i));
      const tl = createTimeline({ autoplay: false });
      this.chapters[i].build(tl);
      tl.onComplete = () => { if (this.all && this.idx < this.chapters.length - 1) setTimeout(() => this.play(this.idx + 1), 1200); };
      this.tl = tl; this.pp.textContent = 'Pause';
      if (autoplay) tl.play();
      return tl;
    }
    toggle() { if (!this.tl) return; if (this.tl.paused) { this.tl.resume(); this.pp.textContent = 'Pause'; } else { this.tl.pause(); this.pp.textContent = 'Resume'; } }
    // Debug: jump to a moment (fires callbacks in order)
    seek(ms) { this.tl.pause(); for (let t = 0; t <= ms; t += 100) this.tl.seek(t); this.tl.seek(ms); }
  }

  global.FlowKit = { el, g, box, plane, orient, pathFn, lerp3, route, shade, Stage, Trace, ObsWall, Device, Wall, Link, Packet, zone, ring, fly, Player, COLORS };
})(window);

  function ch2(tl) {
    const A = R.A; base(tl, '9a1c33e0b6f24f7d8e21c4a0f5d3b812', 360);
    const cap = (p, s, x) => stage.caption.at(tl, p, s, x);
    const close = { x: -160, y: -170, z: A.L, rx: -20, ry: 22, d: 1300 };
    let t = 200;
    t = stage.shot(tl, t, close, 2200);
    cap(300, 'TLS break and inspect', 'Encrypted traffic arrives at Unified Ingress in T1');
    t = pk.appear(tl, t - 600, [-440, Y, A.L], 'tls', 'POST /v1/payments', 'TLS 1.3');
    t = pk.travel(tl, t, route([A.gU]), 900);
    A.uig.activate(tl, t, 5200);
    cap(t, 'Break', 'The TLS session terminates here so the payload can be inspected');
    t = pk.open(tl, t);
    const good = `POST /v1/payments
{
  <span class="hl">"amount": 2500.00,</span>
  "currency": "USD",
  "creditor": { "account": "···9130" },
  "reference": "INV-2231"
}`;
    cap(t, 'Inspect and validate', 'WAF and IPS signatures, then the OpenAPI schema and payload policy');
    t = stage.checklist(tl, t, { at: [-50, -150, A.L], title: 'Payload inspection', code: good, items: [{ t: 'Decrypt: TLS 1.3 terminated' }, { t: 'WAF / IPS: no signatures matched' }, { t: 'Schema: payments.create v3' }, { t: 'Policy: 1.2 KB, application/json, no unknown fields' }], result: 'PASS · re-encrypt (mTLS) to SM-E', step: 520, hold: 900, dx: 40, dy: -260 });
    span(tl, t - 900, A.uig, 'unified-ingress', 0, 22);
    cap(t, 'Re-encrypt', 'The request is re-wrapped in mTLS for the next hop');
    t = pk.seal(tl, t - 200, 'mtls');
    t = pk.travel(tl, t, route([A.uS]), 900, { cls: 'mtls' });
    t = pk.vanish(tl, t);
    // Bad payload
    cap(t, 'A malformed request', 'Same path, but the payload breaks the contract');
    tl.call(() => { A.uS.clear(); A.gU.clear(); }, t);
    t = pk2.appear(tl, t + 300, [-440, Y, A.L], 'tls', 'POST /v1/payments', 'TLS 1.3');
    t = pk2.travel(tl, t, route([A.gU]), 900);
    A.uig.activate(tl, t, 4800);
    t = pk2.open(tl, t);
    const bad = `POST /v1/payments
{
  <span class="bad">"amount": "2500.00",</span>
  "currency": "USD",
  "creditor": { "account": "···9130" },
  <span class="bad">"beneficiaryOverride": "···4471"</span>
}`;
    t = stage.checklist(tl, t, { at: [-50, -150, A.L], title: 'Payload inspection', code: bad, items: [{ t: 'Decrypt: TLS 1.3 terminated' }, { t: 'WAF / IPS: no signatures matched' }, { t: 'Schema: amount must be a number', s: 'fail' }, { t: 'Policy: unknown field beneficiaryOverride', s: 'fail' }], result: 'REJECT · 400 Bad Request', resultColor: '#FB7185', step: 520, hold: 700, dx: 40, dy: -260 });
    span(tl, t - 700, A.uig, 'unified-ingress', 30, 14, 'error', 'unified-ingress  400 schema_violation  trace=9a1c33e0');
    cap(t - 400, 'Rejected at the edge of T1', 'The request never reaches the session tier or the workload; the reject is logged with its trace ID');
    t = pk2.shatter(tl, t - 400);
    tl.call(() => A.gU.mark('bad'), t - 700);
    t = stage.shot(tl, t + 300, SHOT.obs, 2000);
    tl.add({}, { duration: 2500 }, t);
  }

  /* ---------- Chapter 3: failure and failover ---------- */
  function ch3(tl) {
    const B = R.B, A = R.A; base(tl, 'c07d5e21f98a4b0e93a6d1f2e8b74c55', 520);
    const cap = (p, s, x) => stage.caption.at(tl, p, s, x);
    let t = 300;
    cap(t, 'Failure and failover', 'Same request, but things are going wrong along the way');
    t = stage.shot(tl, t, SHOT.edge, 1800);
    t = pk.appear(tl, t, [-1880, -170, 0], 'tls', 'POST /v1/payments', 'trace c07d…4c55');
    span(tl, t, client, 'browser fetch', 0, 512);
    // Edge PoP failure
    t = popA.health(tl, t + 200, 'down');
    tl.call(() => L.cA.mark('dead'), t - 300);
    cap(t, 'Edge PoP failure', 'PoP 1 fails its health checks; Akamai steers the client to PoP 2');
    ring(stage, W, tl, t, popA.top, '#F43F5E', 240);
    t = pk.travel(tl, t + 300, route([L.cB]), 1400);
    popB.activate(tl, t, 1800);
    span(tl, t, popB, 'akamai.edge', 10, 492, 'warn', 'akamai.edge     reroute pop1→pop2  trace=c07d5e21');
    // Regional failover
    stage.shot(tl, t, SHOT.overview, 1800);
    t = A.uig.health(tl, t + 400, 'warn');
    t = A.uig.health(tl, t + 500, 'down');
    tl.call(() => { L.bGA.mark('dead'); A.gU.mark('dead'); }, t);
    ring(stage, W, tl, t, A.uig.top, '#F43F5E', 260);
    cap(t, 'Regional failover', 'Region A ingress is unhealthy; traffic fails over to the Region B cell');
    t = pk.travel(tl, t + 500, route([L.bGB, B.gU]), 1900);
    perimeter.pass(tl, t - 900, LANE.B);
    stage.shot(tl, t - 1200, SHOT.t1B, 1500);
    B.uig.activate(tl, t, 1400);
    t = pk.open(tl, t);
    span(tl, t, B.uig, 'unified-ingress', 24, 470);
    t = pk.seal(tl, t + 500, 'mtls');
    t = pk.travel(tl, t, route([B.uS]), 700, { cls: 'mtls' });
    B.sme.activate(tl, t, 1000);
    span(tl, t, B.sme, 'session-manager.e', 30, 460);
    stage.shot(tl, t, SHOT.t2B, 1600);
    t = pk.travel(tl, t + 300, route([B.sC]), 1200, { cls: 'mtls' });
    fw2.pass(tl, t - 650, LANE.B);
    B.smc.activate(tl, t, 1000);
    span(tl, t, B.smc, 'session-manager.c', 38, 452);
    // Workload error + retry
    const pod = i => [1800, -150, B.wl.pods[i].z];
    t = pk.travel(tl, t + 300, route([B.cW]), 1000, { cls: 'mtls' });
    t = pk.travel(tl, t, { pts: [[1745, Y, B.L], pod(0)] }, 400);
    tl.call(() => B.wl.pods[0].g.classList.add('err'), t);
    tl.add(B.wl.pods[0].g, { x: [0, -6, 6, -4, 0], duration: 400, ease: 'linear' }, t);
    ring(stage, W, tl, t, pod(0), '#F43F5E', 200);
    cap(t, 'Upstream error', 'The first payments-api pod returns 503');
    span(tl, t, [1800, -200, B.wl.pods[0].z], 'payments-api (pod 1)', 60, 40, 'error', 'payments-api     503 upstream  trace=c07d5e21');
    t = pk.state_(tl, t, 'bad', 'POST /v1/payments', '503 from pod 1');
    t = pk.travel(tl, t + 500, { pts: [pod(0), [1560, -150, B.L]] }, 600);
    cap(t, 'Resilient Routing and Retry', 'Ingress retries the idempotent request against a healthy pod');
    t = pk.state_(tl, t, 'mtls', 'POST /v1/payments', 'retry 1 · Idempotency-Key');
    t = pk.travel(tl, t + 200, { pts: [[1560, -150, B.L], pod(2)] }, 700);
    ring(stage, W, tl, t, pod(2), '#34D399', 200);
    tl.add(B.wl.pods[2].g, { y: [0, -14, 0], duration: 600, ease: 'inOutSine' }, t);
    span(tl, t, [1800, -200, B.wl.pods[2].z], 'payments-api (pod 3)', 110, 196, 'ok', 'payments-api     201 retry=1  trace=c07d5e21');
    t += 900;
    cap(t, 'Response', '201 Created returns through Region B and PoP 2; the client never saw an error');
    t = pk.state_(tl, t, 'ok', '201 Created', 'retry 1 · failover');
    stage.shot(tl, t, SHOT.overview, 3000, 'inOutSine');
    t = pk.travel(tl, t + 200, { pts: [pod(2), [1745, Y, B.L]] }, 300, { cls: 'ok' });
    t = pk.travel(tl, t, route([L.cB, L.bGB, B.gU, B.uS, B.sC, B.cW], true), 3400, { cls: 'ok', ease: 'inOutQuad' });
    tl.call(() => { client.screen.innerHTML = SCR.done; }, t);
    ring(stage, W, tl, t, [-1950, -200, 0], '#34D399', 260);
    t = pk.vanish(tl, t);
    t = stage.shot(tl, t, SHOT.obs, 2000);
    tl.add({}, { duration: 2500 }, t);
  }

  /* ---------- Chapter 4: session hijack (ATO) ---------- */
  function ch4(tl) {
    const A = R.A; base(tl, '7c1e0f4a2d9b4c63a8e5f10b3d2c9e77', 120);
    const cap = (p, s, x) => stage.caption.at(tl, p, s, x);
    tl.call(() => { client.screen.innerHTML = SCR.session; }, 0);
    let t = 300;
    cap(t, 'Account takeover attempt', 'A client user is signed in with a valid session');
    t = stage.shot(tl, t, SHOT.attack, 2000);
    tl.call(() => attacker.show(true), t - 800);
    tl.add(attacker.body, { y: [-500, 0], rotateY: [-90, 0], duration: 1000, ease: 'outBack(1.2)' }, t - 800);
    cap(t, 'Cookie theft', 'Infostealer malware on the client copies the session cookie to an attacker');
    const cookie = `<div class="fk-chip" style="--pc:#FB7185;transform:translate(-50%,-50%)">sid cookie</div>`;
    t = fly(stage, W, tl, t + 300, [-1950, -300, 0], [-1950, -300, 760], { html: cookie, dur: 1600, arc: -160 });
    ring(stage, W, tl, t, attacker.top, '#F43F5E', 220);
    cap(t, 'Replay', 'The attacker replays the stolen cookie from their own device');
    t = pk.appear(tl, t + 300, [-1880, -170, 760], 'attack', 'GET /v1/accounts', 'stolen cookie');
    t = pk.travel(tl, t, route([L.xA]), 1700);
    popA.activate(tl, t, 3000);
    t = stage.checklist(tl, t, { at: popA.top, title: 'Akamai edge · risk signals', items: [{ t: 'TLS 1.3: valid' }, { t: 'Device fingerprint: never seen', s: 'warn' }, { t: 'ASN: residential proxy network', s: 'warn' }, { t: 'Geo velocity: NJ to overseas in 4 min', s: 'warn' }], result: 'Risk 87 · forward with risk header', resultColor: '#FBBF24', step: 380, hold: 600 });
    span(tl, t - 900, popA, 'akamai.edge', 0, 11, 'warn', 'akamai.edge      risk=87 new-device  trace=7c1e0f4a');
    stage.shot(tl, t, SHOT.t1A, 2200);
    t = pk.travel(tl, t + 100, route([L.aGA, A.gU]), 1700);
    perimeter.pass(tl, t - 900, LANE.A);
    A.uig.activate(tl, t, 1400);
    span(tl, t, A.uig, 'unified-ingress', 12, 6);
    t = pk.travel(tl, t + 500, route([A.uS]), 700);
    A.sme.activate(tl, t, 3500);
    cap(t, 'Session binding', 'The cookie is genuine, but it is bound to a key the attacker does not have');
    t = stage.checklist(tl, t, { at: A.sme.top, title: 'SM-E', items: [{ t: 'JWS cookie signature (ES256) valid' }, { t: 'Session not expired' }, { t: 'DPoP proof: missing, key does not match', s: 'fail' }, { t: 'Edge risk 87 above threshold', s: 'fail' }], result: 'REJECT 401 · revoke session', resultColor: '#FB7185', step: 480, hold: 500 });
    span(tl, t - 700, A.sme, 'session-manager.e', 20, 4, 'error', 'session-manager.e 401 binding_mismatch  trace=7c1e0f4a');
    t = pk.shatter(tl, t - 300);
    tl.call(() => A.uS.mark('bad'), t - 600);
    // Revoke in SM-C
    stage.shot(tl, t - 400, SHOT.t2A, 1600);
    t = fly(stage, W, tl, t, [380, -220, A.L], [1080, -230, A.L], { color: '#F43F5E', dur: 900, arc: -120 });
    A.smc.activate(tl, t, 2000);
    tl.add(A.smc.body, { x: [0, -5, 5, 0], duration: 300 }, t);
    t = stage.checklist(tl, t, { at: A.smc.top, title: 'SM-C', items: [{ t: 'Session revoked', s: 'fail' }, { t: 'Tokens held in T2 invalidated', s: 'fail' }, { t: 'Security event raised with trace ID' }], step: 360, hold: 400 });
    span(tl, t - 600, A.smc, 'session-manager.c', 26, 3, 'error', 'session-manager.c revoke sid  reason=ato  trace=7c1e0f4a');
    t = stage.shot(tl, t, SHOT.obs, 1800);
    obs.alert(tl, t - 600, 'ATO attempt blocked<br><span style="font-size:30px;font-weight:500">session replay from a new device · session revoked · SOC notified</span>');
    tl.call(() => obs.log('SECURITY  ato.session_replay  sid revoked  trace=7c1e0f4a', '#FDA4AF'), t - 400);
    t += 2200;
    // Legitimate user steps up
    cap(t, 'Recovery', 'On the client’s next action, Sentry requires an AAL3 step-up with Stronghold');
    tl.call(() => { client.screen.innerHTML = SCR.stepup; phone.show(true); }, t);
    tl.add(phone.body, { y: [-300, 0], duration: 900, ease: 'outBack(1.3)' }, t);
    t = stage.shot(tl, t, focus(client, { dist: 1700, rx: -22, ry: 22, dx: 150, dz: -200 }), 2000);
    t = phone.health(tl, t, 'ok');
    ring(stage, W, tl, t, phone.top, '#34D399', 200);
    tl.call(() => { phone.screen.innerHTML = PHONE(true); }, t);
    t = fly(stage, W, tl, t + 200, [-1680, -200, 300], [-1950, -300, 0], { color: '#34D399', dur: 900, arc: -80 });
    tl.call(() => { client.screen.innerHTML = SCR.secured; }, t);
    ring(stage, W, tl, t, [-1950, -200, 0], '#34D399', 260);
    cap(t, 'Contained', 'Fresh device-bound session at AAL3; the stolen cookie is now worthless');
    tl.add({}, { duration: 3500 }, t);
  }

  const chapters = [
    { title: 'Happy path', build: ch1 },
    { title: 'TLS break and inspect', build: ch2 },
    { title: 'Failure and failover', build: ch3 },
    { title: 'Session hijack (ATO)', build: ch4 }
  ];
  stage.onReset(() => { client.screen.innerHTML = SCR.pay; R.A.wl.pods.concat(R.B.wl.pods).forEach(p => p.g.classList.remove('err')); phone.screen.innerHTML = PHONE(false); });
  stage.reset();
  const player = new Player(stage, document.getElementById('controls'), chapters);
  window.FK_PLAYER = player;
  const q = new URLSearchParams(location.search);
  if (q.has('ch')) { player.play(+q.get('ch') - 1, { autoplay: !q.has('t') }); if (q.has('t')) player.seek(+q.get('t')); }
  else player.play(0);
})();

</script>
